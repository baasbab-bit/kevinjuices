  function getListOrderSnapshot_(orderNumber){
    const ord = String(orderNumber || "").trim();
    if (!ord) return null;
    for (const t of TABS) {
      const found = (pools[t] || []).find(o => String(o && o.OrderNumber || "").trim() === ord);
      if (found) return found;
    }
    return null;
  }

  function mergeLatestListSnapshot_(orderObj){
    if (!orderObj) return orderObj;
    const pendingCourier = getPendingCourierAssignment_(orderObj.OrderNumber);
    if (pendingCourier) orderObj = Object.assign({}, orderObj, pendingCourier, { SaveFailed: true });
    const snap = getListOrderSnapshot_(orderObj.OrderNumber);
    if (!snap) return orderObj;

    // Prefer list workflow when it has moved forward from cached PICK.
    if (normWorkflow_(snap.WorkflowStatus) !== "PICK" || normWorkflow_(orderObj.WorkflowStatus) === "PICK") {
      return Object.assign({}, orderObj, snap);
    }
    return Object.assign({}, snap, orderObj);
  }


  function applyOrderToModal_(o){
    o = mergeLatestListSnapshot_(o);
    currentOrder = o;
    const kv = document.getElementById("odKV");
    kv.innerHTML = "";

    const failedAction = getFailedAction_(o.OrderNumber);
    if (failedAction) {
      const a = document.createElement("div");
      a.className = "muted";
      a.textContent = "Warning";
      const b = document.createElement("div");
      b.style.color = "#b91c1c";
      b.style.fontWeight = "900";
      b.textContent = failedAction && failedAction.type === "COURIER_ASSIGN_FAILED"
        ? "⚠️ Courier assignment failed to save. Verify courier and press Retry Courier Save."
        : failedAction && failedAction.type === "COURIER_UNASSIGN_FAILED"
          ? "⚠️ Courier unassign failed to save. Verify in sheet and retry if needed."
          : "⚠️ Save failed. Please verify items and try again.";
      kv.appendChild(a);
      kv.appendChild(b);
    }

    addKV(kv, "Order", o.OrderNumber);
    addKV(kv, "Naam", o.CustomerName);
    addKV(kv, "Tel", o.CustomerPhone);
    addKV(kv, "Email", o.CustomerEmail);
    addKV(kv, "Total", formatSRD(o.OrderTotalSRD));
    addKV(kv, "Workflow", displayWorkflow_(o.WorkflowStatus));
    addKV(kv, "Fulfillment", displayFulfillmentType_(o.FulfillmentType));
    addKV(kv, "Shipping Method", o.ShippingMethod || "");
    addKV(kv, "ReadyAt", formatDateDisplay_(o.ReadyAt || ""));
    addKV(kv, "DispatchAt", formatDateDisplay_(o.DispatchAt || ""));
    addKV(kv, "Courier", o.CourierName || "");
    addKV(kv, "DeliveryStatus", o.DeliveryStatus || "");
    addKV(kv, "DispatchedAt", formatDateDisplay_(o.DispatchedAt || ""));
    addKV(kv, "ReturnAt", formatDateDisplay_(o.ReturnAt || ""));
    addKV(kv, "ReturnedAt", formatDateDisplay_(o.ReturnedAt || ""));
    addKV(kv, "HandledAt", formatDateDisplay_(o.HandledAt || ""));
    addKV(kv, "Pick", o.PickComplete ? "Complete" : "Incompleet");

    const items = Array.isArray(o.Items) ? o.Items : [];
    const multiQtyItems = items.filter(it => Number(it && it.qty || 1) > 1);
    if (multiQtyItems.length) {
      const a = document.createElement("div");
      a.className = "muted";
      a.textContent = "Let op";
      const b = document.createElement("div");
      b.style.color = "#b91c1c";
      b.style.fontWeight = "950";
      b.textContent = "Deze order bevat item(s) met meerdere stuks. Controleer aantallen extra goed.";
      kv.appendChild(a);
      kv.appendChild(b);
    }
    pickChecks = normalizePickChecks_(items, o.PickChecks);
    if (currentOrder && String(currentOrder.OrderNumber || "") === String(o.OrderNumber || "")) {
      currentOrder.PickChecks = pickChecks;
      currentOrder.PickComplete = computePickComplete_(pickChecks);
    }

    document.getElementById("odItemsCount").textContent = `${items.length} item(s)`;

    const itemsWrap = document.getElementById("odItems");
    itemsWrap.innerHTML = "";

    items.forEach((it, idx) => {
      const row = document.createElement("div");
      row.className = "item";

      const pickWrap = document.createElement("div");
      pickWrap.className = "pickCol";

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.className = "pickCb";
      cb.checked = !!pickChecks[idx];
      cb.disabled = normWorkflow_(o.WorkflowStatus) !== "PICK";
      cb.onchange = () => {
        pickChecks[idx] = !!cb.checked;
        currentOrder.PickChecks = pickChecks;
        const pc = computePickComplete_(pickChecks);
        currentOrder.PickComplete = pc;

        // Local-only while picking. We save once when Markeer als Ready is clicked.
        updatePickUI_();
        updateOrderInCaches_(String(currentOrder.OrderNumber || "").trim(), { PickChecks: pickChecks, PickComplete: pc });
        renderCurrent_();

        const resEl = document.getElementById("odActionResult");
        if (resEl) resEl.textContent = pc ? "Alle items aangevinkt. Klaar om te markeren als Ready." : "";
      };

      pickWrap.appendChild(cb);

      const img = document.createElement("img");
      img.className = "thumb";
      const src = firstImageUrl(it);
      if (src) img.src = src;

      const body = document.createElement("div");
      body.style.flex = "1";
      const qty = Number(it.qty || 1);
      const isMultiQty = qty > 1;
      if (isMultiQty) row.classList.add("multiQty");
      const opts = formatOptions(it.options);

      body.innerHTML = `
        <div class="itName">
          <span class="qtyBadge ${isMultiQty ? "" : "normal"}">${escapeHtml(qty)}x</span>${escapeHtml(it.name || "")}
        </div>
        ${isMultiQty ? `<div class="multiQtyWarning">⚠ Let op: ${escapeHtml(qty)} stuks pakken</div>` : ""}
        ${opts ? `<div class="itOpt">${escapeHtml(opts)}</div>` : ""}
      `;

      row.appendChild(pickWrap);
      row.appendChild(img);
      row.appendChild(body);
      itemsWrap.appendChild(row);
    });

    updatePickUI_();
    updateOrderActionsUI_();
    warmImagesForOrder_(o);
  }

  function scheduleSavePickChecks_(){
    // Deprecated: pick checks are now saved once when Markeer als Ready is clicked.
    return;
  }

  function moveOrderBetweenPools_(orderNumber, targetTab, patch){
    const ord = String(orderNumber || "").trim();
    let found = null;

    TABS.forEach(t => {
      const idx = pools[t].findIndex(o => String(o && o.OrderNumber) === ord);
      if (idx >= 0) {
        found = Object.assign({}, pools[t][idx], patch || {});
        pools[t].splice(idx, 1);
        versions[t]++;
        renderSigByTab[t] = null;
      }
    });

    if (!found) found = Object.assign({ OrderNumber: ord }, patch || {});
    pools[targetTab].unshift(found);
    pools[targetTab] = sortNewestFirst_(pools[targetTab], targetTab);
    versions[targetTab]++;
    renderSigByTab[targetTab] = null;
    updateAllBadges_();
  }

  async function markCurrentOrderReady_(){
    if (!currentOrder) throw new Error("No order selected");
    if (!pickCompleteNow_()) throw new Error("Pick is nog niet compleet.");

    const orderNumber = String(currentOrder.OrderNumber || "").trim();
    if (!orderNumber) throw new Error("Missing OrderNumber");

    const modal = document.getElementById("orderModal");
    const resEl = document.getElementById("odActionResult");
    const now = new Date().toISOString();
    const startedFromWorkflow = normWorkflow_(currentOrder.WorkflowStatus);
    const fulfillmentType = normFulfillmentType_(currentOrder.FulfillmentType);
    const targetWorkflow = fulfillmentType === "DELIVERY" ? "DISPATCH" : "READY";
    const targetTab = targetWorkflow === "DISPATCH" ? "dispatch" : "ready";

    currentOrder.WorkflowStatus = targetWorkflow;
    currentOrder.PickComplete = true;
    currentOrder.PickChecks = pickChecks;
    if (targetWorkflow === "READY") currentOrder.ReadyAt = now;
    if (targetWorkflow === "DISPATCH") currentOrder.DispatchAt = now;

    clearFailedAction_(orderNumber);
    setCachedOrderDetail_(currentOrder);

    if (modal) modal.classList.remove("show");
    if (resEl) resEl.textContent = "";

    const patch = { WorkflowStatus: targetWorkflow, PickComplete: true, PickChecks: pickChecks, DetailPreloaded: true };
    if (targetWorkflow === "READY") patch.ReadyAt = now;
    if (targetWorkflow === "DISPATCH") patch.DispatchAt = now;

    moveOrderBetweenPools_(orderNumber, targetTab, patch);

    if (startedFromWorkflow === "PICK") currentTab = "pick";
    renderCurrent_();
    backgroundRefreshCounts_();

    api("markPickedComplete", {
      orderNumber,
      checks: JSON.stringify(pickChecks),
      source: "PickQueue"
    }).then(res => {
      if (!res || !res.ok) throw new Error((res && res.error) || "Failed to complete pick");
      clearFailedAction_(orderNumber);
      dirty.pick = false;
      dirty[targetTab] = false;
      backgroundRefreshCounts_();
    }).catch(e => {
      const failType = targetWorkflow === "DISPATCH" ? "DISPATCH_SAVE_FAILED" : "READY_SAVE_FAILED";
      markFailedAction_(orderNumber, failType, e.message || String(e));
      updateOrderInCaches_(orderNumber, Object.assign({}, patch, { SaveFailed: true }));
      const cached = detailCache.get(orderNumber) || currentOrder || {};
      detailCache.set(orderNumber, Object.assign({}, cached, patch));
      saveDetailCacheToSession_();

      renderSigByTab[targetTab] = null;
      renderSigByTab.pick = null;
      updateAllBadges_();

      currentTab = targetTab;
      showTabContainers_(targetTab);
      document.getElementById("tabPick").classList.toggle("active", false);
      document.getElementById("tabReady").classList.toggle("active", targetTab === "ready");
      document.getElementById("tabDispatch").classList.toggle("active", targetTab === "dispatch");
      document.getElementById("tabReturn").classList.toggle("active", false);
      document.getElementById("tabHandled").classList.toggle("active", false);
      const rf = document.getElementById("readyFilters");
      if (rf) rf.style.display = targetTab === "ready" ? "flex" : "none";
      const df = document.getElementById("dispatchFilters");
      if (df) df.style.display = targetTab === "dispatch" ? "flex" : "none";

      renderCurrent_();
      alert((targetWorkflow === "DISPATCH" ? "Dispatch" : "Ready") + " opslaan mislukt. De order blijft in " + (targetWorkflow === "DISPATCH" ? "Dispatch" : "Ready") + " met een rode waarschuwing. Tik de order om opnieuw te proberen.");
    });
  }

  async function markCurrentOrderReturned_(){
    if (!currentOrder) throw new Error("No order selected");

    const orderNumber = String(currentOrder.OrderNumber || "").trim();
    if (!orderNumber) throw new Error("Missing OrderNumber");

    const modal = document.getElementById("orderModal");

    const previous = JSON.parse(JSON.stringify(pools));
    const previousOrder = JSON.parse(JSON.stringify(currentOrder || {}));
    const previousTab = currentTab;
    const now = new Date().toISOString();

    // Instant UI: close modal and move card out of Return immediately.
    currentOrder.WorkflowStatus = "HANDLED";
    currentOrder.ReturnedAt = now;
    currentOrder.HandledAt = now;
    currentOrder.HandledSource = "PickQueue:returned_to_warehouse";

    setCachedOrderDetail_(currentOrder);

    if (modal) modal.classList.remove("show");

    moveOrderBetweenPools_(orderNumber, "handled", {
      WorkflowStatus: "HANDLED",
      ReturnedAt: now,
      HandledAt: now,
      HandledSource: "PickQueue:returned_to_warehouse",
      DetailPreloaded: true
    });

    renderCurrent_();

    // Background save. No forced reload on success.
    api("setWorkflowStatus", {
      orderNumber,
      workflowStatus: "HANDLED",
      source: "PickQueue:returned_to_warehouse",
      note: "Received Back In Warehouse"
    }).then(res => {
      if (!res || !res.ok) throw new Error((res && res.error) || "Failed to set workflow status");

      clearFailedAction_(orderNumber);
      dirty.return = false;
      dirty.handled = false;
      backgroundRefreshCounts_();

    }).catch(e => {
      TABS.forEach(t => {
        pools[t] = previous[t] || [];
        versions[t]++;
        renderSigByTab[t] = null;
      });

      currentOrder = previousOrder;
      markFailedAction_(orderNumber, "RETURN_RECEIVED_SAVE_FAILED", e.message || String(e));
      updateOrderInCaches_(orderNumber, { SaveFailed: true });
      updateAllBadges_();

      if (previousTab) currentTab = previousTab;
      renderCurrent_();

      alert("Return ontvangen opslaan mislukt. De order staat terug met een rode waarschuwing.");
    });
  }

  function updateOrderInCaches_(orderNumber, patch){
    const ord = String(orderNumber || "").trim();
    TABS.forEach(t => {
      const idx = pools[t].findIndex(o => String(o && o.OrderNumber) === ord);
      if (idx >= 0) {
        pools[t][idx] = Object.assign({}, pools[t][idx], patch || {});
        versions[t]++;
        renderSigByTab[t] = null;
      }
    });

    const cached = detailCache.get(ord);
    if (cached) {
      detailCache.set(ord, Object.assign({}, cached, patch || {}));
      saveDetailCacheToSession_();
    }
  }

  function loadDetailCacheFromSession_(){
    try{
      const raw = sessionStorage.getItem(DETAIL_CACHE_SS_KEY);
      if (!raw) return;
      const obj = JSON.parse(raw);
      if (!obj || typeof obj !== "object") return;
      Object.keys(obj).forEach(k => {
        if (obj[k] && typeof obj[k] === "object") detailCache.set(k, obj[k]);
      });
    }catch(e){}
  }

  function saveDetailCacheToSession_(){
    try{
      const entries = Array.from(detailCache.entries()).slice(0, 200);
      const obj = {};
      entries.forEach(([k,v]) => obj[k] = v);
      sessionStorage.setItem(DETAIL_CACHE_SS_KEY, JSON.stringify(obj));
    }catch(e){}
  }

  function getCachedOrderDetail_(orderNumber){
    const key = String(orderNumber || "").trim();
    if (!key) return null;
    return detailCache.get(key) || null;
  }


  function seedDetailCacheFromList_(orders){
    try{
      if (!Array.isArray(orders) || !orders.length) return;
      let changed = false;

      orders.forEach(o => {
        if (!o || !o.DetailPreloaded) return;
        const key = String(o.OrderNumber || "").trim();
        if (!key) return;

        // Only seed if the response contains item details.
        if (!Array.isArray(o.Items)) return;

        detailCache.set(key, o);
        warmImagesForOrder_(o);
        changed = true;
      });

      if (changed) saveDetailCacheToSession_();
    }catch(e){}
  }

  function setCachedOrderDetail_(orderObj){
    if (!orderObj) return;
    const key = String(orderObj.OrderNumber || "").trim();
    if (!key) return;
    detailCache.set(key, orderObj);
    saveDetailCacheToSession_();
  }


  window.pqDetailCacheStats = function(){
    try {
      return { size: detailCache.size, keys: Array.from(detailCache.keys()) };
    } catch(e) { return { error: String(e) }; }
  };

  async function prefetchOrderDetail_(orderNumber, force = false){
    const key = String(orderNumber || "").trim();
    if (!key) return null;
    if (!force && detailCache.has(key)) return detailCache.get(key);

    const res = await api("getOrder", { orderNumber: key });
    if (res && res.ok && res.order) {
      setCachedOrderDetail_(res.order);
      warmImagesForOrder_(res.order);
      return res.order;
    }
    return null;
  }

  function prefetchTopDetails_(orders){
    // Disabled intentionally. Active tab list responses already contain full order details.
    // Keeping this as a no-op prevents old top-8 background getOrder calls.
    return;
  }

  function warmImagesForOrder_(orderObj){
    try{
      const items = Array.isArray(orderObj && orderObj.Items) ? orderObj.Items : [];
      items.forEach(it => {
        const urls = [];
        if (it && it.thumbUrl) urls.push(it.thumbUrl);
        if (it && it.imageUrl) urls.push(it.imageUrl);
        if (it && Array.isArray(it.altImageUrls)) urls.push(...it.altImageUrls);
        urls.filter(Boolean).slice(0,2).forEach(u => { const img = new Image(); img.src = u; });
      });
    }catch(e){}
  }

  const settingsModal = document.getElementById("settingsModal");
  const orderModal = document.getElementById("orderModal");

  document.getElementById("btnSettings").onclick = () => {
    document.getElementById("apiBase").value = getApiBase();
    document.getElementById("pingResult").textContent = "";
    settingsModal.classList.add("show");
  };

  document.getElementById("closeSettings").onclick = () => settingsModal.classList.remove("show");
  settingsModal.addEventListener("click", e => { if (e.target === settingsModal) settingsModal.classList.remove("show"); });

  document.getElementById("btnSaveApi").onclick = async () => {
    setApiBase(document.getElementById("apiBase").value);
    await loadBuildInfo();
    TABS.forEach(t => { dirty[t] = true; cachesLoaded[t] = false; });
    await safeLoadOrders(true);
    settingsModal.classList.remove("show");
  };

  document.getElementById("btnTestPing").onclick = async () => {
    setApiBase(document.getElementById("apiBase").value);
    const el = document.getElementById("pingResult");
    el.textContent = "Testing…";
    try{
      const res = await api("ping");
      el.textContent = res && res.ok ? `OK: ${res.build} @ ${res.time}` : `Fail: ${(res && res.error) || "unknown"}`;
    }catch(e){
      el.textContent = "Error: " + (e.message || String(e));
    }
  };

  document.getElementById("closeOrder").onclick = () => orderModal.classList.remove("show");
  orderModal.addEventListener("click", e => { if (e.target === orderModal) orderModal.classList.remove("show"); });

  document.getElementById("tabPick").addEventListener("click", ev => { ev.preventDefault(); onTabSwitch_("pick"); });
  document.getElementById("tabReady").addEventListener("click", ev => { ev.preventDefault(); onTabSwitch_("ready"); });
  document.getElementById("tabDispatch").addEventListener("click", ev => { ev.preventDefault(); onTabSwitch_("dispatch"); });
  document.getElementById("tabReturn").addEventListener("click", ev => { ev.preventDefault(); onTabSwitch_("return"); });
  document.getElementById("tabHandled").addEventListener("click", ev => { ev.preventDefault(); onTabSwitch_("handled"); });


  document.querySelectorAll("[data-ready-filter]").forEach(btn => {
    btn.addEventListener("click", ev => {
      ev.preventDefault();
      readyFilter = btn.getAttribute("data-ready-filter") || "all";
      document.querySelectorAll("[data-ready-filter]").forEach(b => b.classList.toggle("active", b === btn));
      renderSigByTab.ready = null;
      renderCurrent_();
    });
  });


  const dispatchFiltersEl = document.getElementById("dispatchFilters");
  if (dispatchFiltersEl) {
    dispatchFiltersEl.addEventListener("click", ev => {
      const btn = ev.target && ev.target.closest ? ev.target.closest("[data-dispatch-filter]") : null;
      if (!btn || !dispatchFiltersEl.contains(btn)) return;
      ev.preventDefault();
      ev.stopPropagation();

      dispatchFilter = btn.getAttribute("data-dispatch-filter") || "all";
      syncDispatchFilterActiveButtons_();
      renderSigByTab.dispatch = null;
      renderCurrent_();
    });
  }

  document.getElementById("btnRefresh").onclick = async () => {
    dirty[currentTab] = true;
    await safeLoadOrders(true);
  };

  document.getElementById("btnUnassignCourier").onclick = async () => {
    const resEl = document.getElementById("odActionResult");
    try{
      if (resEl) resEl.textContent = "";
      await unassignCourierForCurrentOrder_();
    }catch(e){
      if (resEl) resEl.textContent = "❌ " + (e.message || String(e));
    }
  };

  document.getElementById("btnAssignCourier").onclick = async () => {
    const resEl = document.getElementById("odActionResult");
    try{
      if (resEl) resEl.textContent = "";
      await assignCourierForCurrentOrder_();
    }catch(e){
      if (resEl) resEl.textContent = "❌ " + (e.message || String(e));
    }
  };

  document.getElementById("btnPrintOrderLabel").onclick = async () => {
    const resEl = document.getElementById("odActionResult");
    try{
      if (resEl) resEl.textContent = "";
      await printCurrentOrderLabel_();
    }catch(e){
      if (resEl) resEl.textContent = "❌ " + (e.message || String(e));
    }
  };

  document.getElementById("btnMarkReady").onclick = async () => {
    const resEl = document.getElementById("odActionResult");
    try{
      if (resEl) resEl.textContent = "";
      const workflow = normWorkflow_(currentOrder && currentOrder.WorkflowStatus);
      if (workflow === "RETURN") await markCurrentOrderReturned_();
      else await markCurrentOrderReady_();
    }catch(e){
      if (resEl) resEl.textContent = "❌ " + (e.message || String(e));
    }
  };

  (async function init(){
    loadDetailCacheFromSession_();
    loadFailedActionsFromSession_();
    loadPendingCourierAssignmentsFromSession_();

    const sb = document.getElementById("searchBox");
    if (sb) {
      sb.addEventListener("input", () => {
        searchQuery = sb.value || "";
        renderCurrent_();
      });
    }

    await loadBuildInfo();
    await loadCouriers_();
    await safeLoadOrders(true);
    startBackgroundSync_();

    if (!getApiBase()) {
      document.getElementById("hint").textContent = "Open Settings en plak je Apps Script /exec URL.";
    }
  })();
</script>







<script>
/* Fixed lazy Handled loader
   - Reuses the page's existing api() function when available.
   - Falls back to all known localStorage API URL keys.
   - Keeps range buttons visible only when Handled tab is active.
*/
(function(){
  window.pqHandledDays = window.pqHandledDays || 3;

  function getKnownApiBase_(){
    var keys = [
      "pq_api_base_v1",
      "pick_queue_api_base",
      "apiBase",
      "API_BASE",
      "pq_api_base"
    ];

    for(var i = 0; i < keys.length; i++){
      try{
        var v = (localStorage.getItem(keys[i]) || "").trim();
        if(v) return v;
      }catch(e){}
    }

    try{
      if(typeof getApiBase === "function"){
        var g = String(getApiBase() || "").trim();
        if(g) return g;
      }
    }catch(e){}

    try{
      var input = document.getElementById("apiBase");
      if(input && input.value) return String(input.value || "").trim();
    }catch(e){}

    return "";
  }

  function jsonp_(url){
    return new Promise(function(resolve, reject){
      var cbName = "cb_" + Math.random().toString(36).slice(2);
      var script = document.createElement("script");
      script.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + "callback=" + cbName + "&_=" + Date.now();

      script.onerror = function(){
        cleanup();
        reject(new Error("JSONP load error"));
      };

      window[cbName] = function(data){
        cleanup();
        resolve(data);
      };

      function cleanup(){
        try{ delete window[cbName]; }catch(e){ window[cbName] = undefined; }
        if(script && script.parentNode) script.parentNode.removeChild(script);
      }

      document.body.appendChild(script);
    });
  }

  function callApi_(action, params){
    params = params || {};

    // Best path: reuse the original page api() function, because other tabs already work.
    try{
      if(typeof api === "function"){
        return api(action, params);
      }
    }catch(e){}

    var base = getKnownApiBase_();
    if(!base) return Promise.reject(new Error("Missing API base URL. Open Settings."));

    var u = new URL(base);
    u.search = "";
    u.hash = "";
    u.searchParams.set("action", action);

    Object.keys(params).forEach(function(k){
      u.searchParams.set(k, params[k]);
    });

    return jsonp_(u.toString());
  }

  function esc_(s){
    return String(s || "").replace(/[&<>"']/g, function(m){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m];
    });
  }

  function formatMoney_(v){
    var n = Number(v || 0);
    return "SRD " + n.toLocaleString("nl-NL", { maximumFractionDigits: 2, useGrouping: false });
  }

  function formatDate_(v){
    if(!v) return "";
    try{
      var d = new Date(String(v).replace(" ", "T"));
      if(isNaN(d.getTime())) return String(v);
      return d.toLocaleDateString("nl-NL", { timeZone:"America/Paramaribo" }) + " · " +
        d.toLocaleTimeString("nl-NL", { timeZone:"America/Paramaribo", hour:"2-digit", minute:"2-digit" });
    }catch(e){
      return String(v);
    }
  }

  function ensureHandledArea_(){
    var list = document.getElementById("listHandled") ||
      document.querySelector('[data-list="handled"]') ||
      document.querySelector("#handledList");

    if(!list){
      var wrap = document.querySelector(".wrap") || document.body;
      list = document.createElement("div");
      list.id = "listHandled";
      list.className = "grid";
      list.style.display = "none";
      wrap.appendChild(list);
    }

    var controls = document.getElementById("handledRangeControls");
    if(!controls){
      controls = document.createElement("div");
      controls.id = "handledRangeControls";
      controls.style.display = "none";
      controls.style.gap = "8px";
      controls.style.flexWrap = "wrap";
      controls.style.margin = "10px 0";
      controls.innerHTML =
        '<button class="btn" data-days="3">Last 3 days</button>' +
        '<button class="btn" data-days="10">Next 7 days</button>' +
        '<button class="btn" data-days="40">Next 30 days</button>' +
        '<span class="muted" id="handledRangeInfo"></span>';

      list.parentNode.insertBefore(controls, list);

      controls.addEventListener("click", function(ev){
        var btn = ev.target.closest("button[data-days]");
        if(!btn) return;
        ev.preventDefault();
        ev.stopPropagation();
        window.pqHandledDays = Number(btn.getAttribute("data-days") || 3);
        window.pqLoadHandledLazy_(window.pqHandledDays);
      });
    }

    return { list:list, controls:controls };
  }

  function hideHandledControls_(){
    var controls = document.getElementById("handledRangeControls");
    if(controls) controls.style.display = "none";
  }

  function showHandledOnly_(){
    // Hide common list containers, including old compatibility names.
    ["listPick","listReady","listReturn","listOpen","listClosed"].forEach(function(id){
      var el = document.getElementById(id);
      if(el) el.style.display = "none";
    });

    var area = ensureHandledArea_();
    area.list.style.display = "grid";
    area.controls.style.display = "flex";
  }

  function renderHandled_(orders, days){
    var area = ensureHandledArea_();
    var list = area.list;
    list.innerHTML = "";

    var info = document.getElementById("handledRangeInfo");
    if(info) info.textContent = (orders || []).length + " order(s) loaded · last " + days + " days";

    if(!orders || !orders.length){
      list.innerHTML = '<div class="muted" style="padding:12px;">No handled orders in this range.</div>';
      return;
    }

    orders.forEach(function(o){
      var card = document.createElement("div");
      card.className = "card";
      card.dataset.status = "handled";
      card.innerHTML =
        '<div class="cardHead">' +
          '<div class="cardRow1">' +
            '<div class="ordno">' + esc_(o.OrderNumber) + '</div>' +
            '<div class="total">' + esc_(formatMoney_(o.OrderTotalSRD)) + '</div>' +
          '</div>' +
          '<div class="cardRow2">' +
            '<div class="name">' + esc_(o.CustomerName) + '</div>' +
            '<div class="muted cardDt">' + esc_(formatDate_(o.HandledAt || o.ReturnedAt || o.ReadyAt || o.CreatedAt)) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="pills">' +
          '<span class="pill ok">Handled</span>' +
          '<span class="pill">' + esc_(o.HandledSource || "—") + '</span>' +
        '</div>';

      list.appendChild(card);
    });
  }

  window.pqLoadHandledLazy_ = async function(days){
    days = Number(days || 3);
    var area = ensureHandledArea_();
    showHandledOnly_();
    area.list.innerHTML = '<div class="muted" style="padding:12px;">Loading handled orders…</div>';

    try{
      var res = await callApi_("getHandledOrders", { days: days });
      if(!res || !res.ok) throw new Error((res && res.error) || "Failed to load handled orders");
      renderHandled_(res.orders || [], res.days || days);

      var badge = document.getElementById("badgeHandled");
      if(badge) badge.textContent = String((res.orders || []).length);

    }catch(e){
      area.list.innerHTML = '<div class="muted" style="padding:12px;">Error loading handled: ' + esc_(e.message || String(e)) + '</div>';
    }
  };

  window.pqMarkReturnReceived_ = async function(orderNumber){
    var on = String(orderNumber || "").trim();
    if(!on && window.currentOrder) on = String(window.currentOrder.OrderNumber || "").trim();

    if(!on){
      alert("Missing order number.");
      return;
    }

    if(!confirm("Mark this return as received back in warehouse?")) return;

    try{
      var res = await callApi_("setWorkflowStatus", {
        orderNumber: on,
        workflowStatus: "HANDLED",
        source: "WarehouseReturn",
        note: "Received Back In Warehouse"
      });

      if(!res || !res.ok) throw new Error((res && res.error) || "Failed to update order");

      alert("Return received and moved to Handled.");
      location.reload();

    }catch(e){
      alert("Error: " + (e && e.message ? e.message : String(e)));
    }
  };

  function bindTabs_(){
    var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));

    tabs.forEach(function(tab){
      var text = String(tab.textContent || "").toLowerCase();
      var isHandled = (tab.dataset && tab.dataset.tab === "handled") || text.indexOf("handled") >= 0 || text.indexOf("afgehandeld") >= 0;

      if(isHandled){
        if(tab.dataset.lazyHandledBound === "1") return;
        tab.dataset.lazyHandledBound = "1";

        tab.addEventListener("click", function(ev){
          ev.preventDefault();
          ev.stopPropagation();

          tabs.forEach(function(t){ t.classList.remove("active"); });
          tab.classList.add("active");

          window.pqLoadHandledLazy_(window.pqHandledDays || 3);
        }, true);

      } else {
        // Any non-handled tab should hide handled controls immediately.
        tab.addEventListener("click", function(){
          hideHandledControls_();
          var handledList = document.getElementById("listHandled");
          if(handledList) handledList.style.display = "none";
        }, true);
      }
    });
  }

  document.addEventListener("DOMContentLoaded", function(){
    ensureHandledArea_();
    hideHandledControls_();
    bindTabs_();
  });
})();
</script>

</body>
</html>

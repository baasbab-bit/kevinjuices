<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pick Queue - Pick Ready Handled</title>
  <style>
    :root{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      --wa-header:#075E54;
      --wa-accent:#25D366;
      --wa-accent-2:#128C7E;
      --wa-bg:#E9F5EF;
      --wa-card:#FFFFFF;
      --wa-text:#0b1b14;
      --wa-muted:rgba(11,27,20,.62);
      --wa-border:rgba(11,27,20,.10);
      --wa-shadow:0 6px 18px rgba(0,0,0,.06);
    }

    body{ margin:0; background:var(--wa-bg); color:var(--wa-text); }
    header{
      position:sticky; top:0; z-index:50;
      background:linear-gradient(90deg,#075E54,#128C7E);
      color:#fff; border-bottom:1px solid rgba(255,255,255,.12);
      padding:12px 14px; display:flex; gap:10px; align-items:center;
    }
    header h1{ font-size:16px; margin:0; font-weight:900; color:#fff; }
    .grow{ flex:1; }
    .muted{ color:var(--wa-muted); font-size:12px; }
    header .muted{ color:rgba(255,255,255,.84); }

    .btn{
      border:1px solid #ddd; background:#fff; padding:8px 10px;
      border-radius:10px; cursor:pointer; font-weight:800;
    }
    .btn:active{ transform:translateY(1px); }
    .btn[disabled]{ opacity:.45; cursor:not-allowed; }
    header .btn{
      background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.28); color:#fff;
    }

    .input{
      padding:8px 10px; border:1px solid #ddd; border-radius:10px;
      width:420px; max-width:52vw;
    }
    header .input{
      background:rgba(255,255,255,.96); color:#111; border-color:rgba(0,0,0,.10);
      box-shadow:0 2px 10px rgba(0,0,0,.10);
    }

    .tabs{
      display:flex; gap:8px; padding:10px 14px;
      background:linear-gradient(90deg,#075E54,#128C7E);
      position:sticky; top:52px; z-index:49;
      border-bottom:1px solid rgba(255,255,255,.15);
    }
    .tab{
      flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
      padding:10px 12px; border:1px solid rgba(255,255,255,.28);
      border-radius:14px 14px 0 0; background:rgba(255,255,255,.14);
      color:#fff; cursor:pointer; font-weight:900;
    }
    .tab.active{ background:#25D366; border-color:#25D366; color:#0b2b22; }
    .badge{
      display:inline-flex; align-items:center; justify-content:center;
      min-width:20px; height:18px; padding:0 6px; border-radius:999px;
      font-size:12px; font-weight:900; background:rgba(255,255,255,.18);
      color:inherit; border:1px solid rgba(255,255,255,.25);
    }

    .spinner{
      width:14px; height:14px; margin-left:8px; border-radius:999px;
      border:2px solid rgba(255,255,255,.25); border-top-color:#fff;
      display:none; animation:spin .8s linear infinite;
    }
    .btn.loading .spinner{ display:inline-block; }
    .btn.loading{ opacity:.75; cursor:progress; }
    @keyframes spin{ to{ transform:rotate(360deg); } }

    .wrap{ padding:0 14px 18px; }
    .grid{ display:grid; grid-template-columns:1fr; gap:10px; }
    .card{
      position:relative; overflow:hidden; background:var(--wa-card);
      border:1px solid var(--wa-border); border-radius:18px;
      box-shadow:var(--wa-shadow); padding:14px 14px 12px 18px;
      cursor:pointer; transition:box-shadow .15s ease, transform .06s ease;
    }
    .card:hover{ box-shadow:0 8px 22px rgba(0,0,0,.08); }
    .card:active{ transform:translateY(1px); }
    .card::before{
      content:""; position:absolute; left:0; top:0; bottom:0; width:6px;
      background:var(--accent,var(--wa-accent));
    }
    .card[data-workflow="PICK"]{ --accent:#2563eb; }
    .card[data-workflow="READY"]{ --accent:#25D366; }
    .card[data-workflow="DISPATCH"]{ --accent:#f97316; }
    .card[data-workflow="HANDLED"]{ --accent:#128C7E; opacity:.92; }
    .card.saveFailed{
      border-color:rgba(220,38,38,.55) !important;
      background:#fff7f7 !important;
      box-shadow:0 0 0 2px rgba(220,38,38,.10), var(--wa-shadow) !important;
    }
    .card.saveFailed::before{ background:#dc2626 !important; }

    .cardRow1{ display:flex; justify-content:space-between; gap:12px; align-items:baseline; }
    .cardRow2{ display:flex; justify-content:space-between; gap:10px; align-items:baseline; margin-top:6px; }
    .ordno{ font-weight:950; letter-spacing:.2px; }
    .total{ font-weight:950; white-space:nowrap; }
    .name{ font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .cardDt{ white-space:nowrap; font-variant-numeric:tabular-nums; }

    .pills{ margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
    .pill{
      font-size:12px; border:1px solid rgba(11,27,20,.12);
      padding:5px 9px; border-radius:999px; background:rgba(255,255,255,.65);
    }
    .pill.ok{ border-color:rgba(37,211,102,.35); background:rgba(37,211,102,.12); }
    .pill.warn{ border-color:rgba(255,194,66,.45); background:rgba(255,194,66,.14); }
    .pill.bad{ border-color:rgba(231,76,60,.40); background:rgba(231,76,60,.12); }
    .pill.delivery{ border-color:rgba(37,99,235,.35); background:rgba(37,99,235,.12); color:#1d4ed8; font-weight:950; }
    .pill.pickup{ border-color:rgba(18,140,126,.35); background:rgba(18,140,126,.12); color:#0f766e; font-weight:950; }

    .dayGroupHeader{
      display:flex; justify-content:space-between; align-items:baseline; gap:10px;
      padding:8px 10px; margin-top:8px; border:1px solid rgba(0,0,0,.08);
      border-radius:14px; background:rgba(255,255,255,.70); cursor:pointer; user-select:none;
    }
    .dayGroupLeft{ display:flex; align-items:baseline; gap:8px; min-width:0; }
    .dayGroupChevron{ display:inline-block; width:16px; text-align:center; font-weight:900; color:rgba(11,27,20,.60); transition:transform .12s ease; }
    .dayGroupChevron.collapsed{ transform:rotate(-90deg); }
    .dayGroupTitle{ font-weight:950; font-size:13px; color:rgba(11,27,20,.80); text-transform:capitalize; }
    .dayGroupMeta{ font-size:12px; color:rgba(11,27,20,.55); font-weight:900; white-space:nowrap; }


    .item.multiQty{
      border-color:rgba(220,38,38,.55) !important;
      background:#fff7f7 !important;
      box-shadow:0 0 0 2px rgba(220,38,38,.08);
    }
    .item.multiQty .itName{
      font-size:16px;
    }
    .qtyBadge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:46px;
      padding:6px 10px;
      margin-right:8px;
      border-radius:999px;
      font-size:18px;
      font-weight:950;
      color:#fff;
      background:#dc2626;
      box-shadow:0 2px 8px rgba(220,38,38,.22);
      vertical-align:middle;
    }
    .qtyBadge.normal{
      color:inherit;
      background:transparent;
      box-shadow:none;
      min-width:auto;
      padding:0;
      margin-right:6px;
      font-size:inherit;
    }
    .multiQtyWarning{
      display:inline-flex;
      align-items:center;
      gap:6px;
      margin-top:6px;
      padding:6px 9px;
      border-radius:10px;
      font-size:12px;
      font-weight:900;
      color:#991b1b;
      background:#fee2e2;
      border:1px solid #fecaca;
    }

    .modalBackdrop{ position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:flex-end; z-index:1000; }
    .modalBackdrop.show{ display:flex; }
    .sheet{
      width:100%; max-width:780px; margin:0 auto; background:#fff;
      border-radius:18px 18px 0 0; padding:14px;
      max-height:88vh; overflow:auto; padding-bottom:max(14px,env(safe-area-inset-bottom));
    }
    .row{ display:flex; justify-content:space-between; gap:10px; align-items:center; }
    .sheet h2{ margin:0; font-size:16px; }
    .close{ border:1px solid #ddd; background:#fff; padding:8px 10px; border-radius:10px; cursor:pointer; font-weight:900; }
    .sec{ margin-top:12px; border-top:1px solid #eee; padding-top:12px; }
    .kv{ display:grid; grid-template-columns:120px 1fr; gap:6px 12px; font-size:13px; }
    .kv div{ padding:2px 0; }
    .items{ display:flex; flex-direction:column; gap:10px; }
    .item{ display:flex; gap:10px; border:1px solid #eee; border-radius:12px; padding:10px; }
    .pickCb{ width:20px; height:20px; margin-top:3px; }
    .pickCol{ display:flex; align-items:flex-start; }
    .thumb{ width:54px; height:54px; border-radius:10px; background:#f1f1f1; object-fit:cover; flex:0 0 54px; }
    .itName{ font-weight:900; }
    .itOpt{ font-size:12px; color:#666; margin-top:2px; }
    .itQty{ font-weight:950; margin-right:6px; }


    .readyFilters{
      display:none;
      gap:8px;
      flex-wrap:wrap;
      margin:10px 0 8px;
    }
    .filterBtn{
      border:1px solid rgba(11,27,20,.12);
      background:rgba(255,255,255,.75);
      color:var(--wa-text);
      border-radius:999px;
      padding:7px 10px;
      font-size:12px;
      font-weight:900;
      cursor:pointer;
    }
    .filterBtn.active{
      background:var(--wa-accent);
      border-color:var(--wa-accent);
      color:#0b2b22;
    }
    .ageBadge{
      display:inline-flex;
      align-items:center;
      gap:4px;
      border-radius:999px;
      padding:4px 8px;
      font-weight:900;
      border:1px solid rgba(11,27,20,.12);
    }
    .ageBadge.today{ background:rgba(37,211,102,.14); border-color:rgba(37,211,102,.35); }
    .ageBadge.mid{ background:rgba(255,194,66,.16); border-color:rgba(255,194,66,.45); }
    .ageBadge.old{ background:rgba(231,76,60,.14); border-color:rgba(231,76,60,.40); }

    @media (max-width:640px){
      header{ flex-wrap:wrap; gap:8px; padding:10px 12px; }
      header h1{ font-size:18px; }
      #searchBox{ width:100% !important; max-width:none !important; flex:1 1 100%; order:3; }
      #buildInfo{ flex:1 1 100%; order:4; font-size:11px; line-height:1.2; }
      .btn,.close{ padding:8px 10px; border-radius:12px; font-size:12px; }
      .tabs{ top:100px; padding:8px 12px; gap:6px; }
      .tab{ padding:9px 8px; font-size:13px; }
      .wrap{ padding:0 12px 16px; }
      .grid{ gap:10px; }
      .card{ padding:12px 12px 10px 16px; border-radius:16px; }
      .card::before{ width:5px; }
      .ordno,.total{ font-size:14px; }
      .name{ font-size:14px; }
      .cardDt{ font-size:11px; }
      .pill{ font-size:11px; padding:4px 8px; }
  
    .item.multiQty{
      border-color:rgba(220,38,38,.55) !important;
      background:#fff7f7 !important;
      box-shadow:0 0 0 2px rgba(220,38,38,.08);
    }
    .item.multiQty .itName{
      font-size:16px;
    }
    .qtyBadge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:46px;
      padding:6px 10px;
      margin-right:8px;
      border-radius:999px;
      font-size:18px;
      font-weight:950;
      color:#fff;
      background:#dc2626;
      box-shadow:0 2px 8px rgba(220,38,38,.22);
      vertical-align:middle;
    }
    .qtyBadge.normal{
      color:inherit;
      background:transparent;
      box-shadow:none;
      min-width:auto;
      padding:0;
      margin-right:6px;
      font-size:inherit;
    }
    .multiQtyWarning{
      display:inline-flex;
      align-items:center;
      gap:6px;
      margin-top:6px;
      padding:6px 9px;
      border-radius:10px;
      font-size:12px;
      font-weight:900;
      color:#991b1b;
      background:#fee2e2;
      border:1px solid #fecaca;
    }

    .modalBackdrop{ align-items:stretch; }
      .sheet{ max-height:92vh; padding:12px; border-radius:16px 16px 0 0; }
      .kv{ grid-template-columns:92px 1fr; font-size:12px; }
      .input{ width:100%; max-width:none; }
      .item{ padding:8px; gap:8px; }
      .thumb{ width:44px; height:44px; border-radius:10px; }
      .itName{ font-size:13px; word-break:break-word; }
      .itOpt{ font-size:11px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Pick Queue</h1>
    <div class="grow"></div>
    <input class="input" id="searchBox" placeholder="Zoek order of klant…" style="width:240px;max-width:46vw;" />
    <span class="muted" id="buildInfo">not connected</span>
    <button class="btn" id="btnSettings">Settings</button>
    <button class="btn" id="btnRefresh"><span class="btnLabel">Refresh</span><span class="spinner" aria-hidden="true"></span></button>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="pick" id="tabPick">Pick<span class="badge" id="badgePick">0</span></button>
    <button class="tab" data-tab="ready" id="tabReady">Ready<span class="badge" id="badgeReady">0</span></button>
    <button class="tab" data-tab="dispatch" id="tabDispatch">Dispatch<span class="badge" id="badgeDispatch">0</span></button>
    <button class="tab" data-tab="return" id="tabReturn">Return<span class="badge" id="badgeReturn">0</span></button>
    <button class="tab" data-tab="handled" id="tabHandled">Handled<span class="badge" id="badgeHandled">0</span></button>
  </div>

  <div class="wrap">
    <div class="muted" id="hint"></div>
    <div class="readyFilters" id="readyFilters">
      <button class="filterBtn active" data-ready-filter="all">All <span id="rfAll">0</span></button>
      <button class="filterBtn" data-ready-filter="today">Today <span id="rfToday">0</span></button>
      <button class="filterBtn" data-ready-filter="mid">1-3 Days <span id="rfMid">0</span></button>
      <button class="filterBtn" data-ready-filter="old">4+ Days <span id="rfOld">0</span></button>
    </div>
    <div class="readyFilters" id="dispatchFilters">
      <button type="button" class="filterBtn active" data-dispatch-filter="all">All <span id="dfAll">0</span></button>
      <button type="button" class="filterBtn" data-dispatch-filter="unassigned">Unassigned <span id="dfUnassigned">0</span></button>
      <button type="button" class="filterBtn" data-dispatch-filter="assigned">Assigned <span id="dfAssigned">0</span></button>
      <span id="dispatchCourierFilters" style="display:flex; gap:8px; flex-wrap:wrap;"></span>
    </div>
    <div class="muted" id="debugInfo" style="margin-top:4px;"></div>
    <div class="grid" id="listPick"></div>
    <div class="grid" id="listReady" style="display:none;"></div>
    <div class="grid" id="listDispatch" style="display:none;"></div>
    <div class="grid" id="listReturn" style="display:none;"></div>
    <div class="grid" id="listHandled" style="display:none;"></div>
  </div>

  <div class="modalBackdrop" id="settingsModal">
    <div class="sheet">
      <div class="row">
        <h2>Settings</h2>
        <button class="close" id="closeSettings">Close</button>
      </div>
      <div class="sec">
        <div class="kv">
          <div class="muted">API URL</div>
          <div>
            <input class="input" id="apiBase" placeholder="https://script.google.com/macros/s/.../exec" />
            <div class="muted" style="margin-top:6px;">Plak de Apps Script Web App /exec URL hier.</div>
          </div>
        </div>
        <div style="margin-top:10px; display:flex; gap:8px;">
          <button class="btn" id="btnTestPing">Test ping</button>
          <button class="btn" id="btnSaveApi">Save</button>
        </div>
        <div class="muted" id="pingResult" style="margin-top:10px;"></div>
      </div>
    </div>
  </div>

  <div class="modalBackdrop" id="orderModal">
    <div class="sheet">
      <div class="row">
        <h2 id="odTitle">Order</h2>
        <button class="close" id="closeOrder">Close</button>
      </div>

      <div class="sec">
        <div class="kv" id="odKV"></div>
      </div>

      <div class="sec">
        <div class="row" style="margin-bottom:10px;">
          <strong>Items</strong>
          <span class="muted" id="odItemsCount"></span>
          <span class="muted" id="odPickStatus"></span>
        </div>
        <div class="items" id="odItems"></div>
      </div>

      <div class="sec" id="odActionsSec">
        <div class="row" style="margin-bottom:10px;">
          <strong>Workflow</strong>
          <span class="muted" id="odStatusHint">—</span>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn" id="btnMarkReady" disabled>Markeer als Ready</button>
          <select class="input" id="courierSelect" style="display:none; width:220px; max-width:100%;"></select>
          <button class="btn" id="btnAssignCourier" style="display:none;">Assign Courier</button>
          <button class="btn" id="btnUnassignCourier" style="display:none;">Unassign Courier</button>
          <button class="btn" id="btnPrintOrderLabel">Print Label</button>
        </div>
        <div class="muted" id="odActionResult" style="margin-top:10px;"></div>
      </div>
    </div>
  </div>

<script>
  const LS_KEY = "pq_api_base_v2";
  const DEBUG = /(?:\?|&)debug=1(?:&|$)/.test(location.search);
  const TABS = ["pick","ready","dispatch","return","handled"];
  const ACTION_BY_TAB = {
    pick: "getPickOrders",
    ready: "getReadyOrders",
    dispatch: "getDispatchOrders",
    return: "getReturnOrders",
    handled: "getHandledOrders"
  };

  let currentTab = "pick";
  let currentOrder = null;
  let searchQuery = "";
  let readyFilter = "all";
  let dispatchFilter = "all";
  let pickChecks = [];
  let pickSaveTimer = null;
  let couriers = [];

  const pools = { pick: [], ready: [], dispatch: [], return: [], handled: [] };
  const cachesLoaded = { pick: false, ready: false, dispatch: false, return: false, handled: false };
  const dirty = { pick: true, ready: true, dispatch: true, return: true, handled: true };
  const loading = { pick: null, ready: null, dispatch: null, return: null, handled: null };
  const versions = { pick: 0, ready: 0, dispatch: 0, return: 0, handled: 0 };
  const renderSigByTab = { pick: null, ready: null, dispatch: null, return: null, handled: null };

  const detailCache = new Map();
  const failedActions = {}; // sessionStorage-backed: orderNumber -> {type,message,time}
  const pendingCourierAssignments = {}; // sessionStorage-backed: orderNumber -> courier assignment patch
  const FAILED_ACTIONS_SS_KEY = "pq_failed_actions_v1";
  const PENDING_COURIER_SS_KEY = "pq_pending_courier_assignments_v1";
  const DETAIL_CACHE_SS_KEY = "pq_detail_cache_v2";
  const DETAIL_PREFETCH_LIMIT = 8;
  const BACKGROUND_SYNC_MS = 60000;
  let backgroundSyncTimer = null;
  let backgroundSyncRunning = false;

  function getApiBase(){
    return (localStorage.getItem(LS_KEY) || localStorage.getItem("pq_api_base_v1") || "").trim();
  }

  function normalizeApiBase_(v){
    const raw = (v || "").trim();
    if (!raw) return "";
    try{
      const u = new URL(raw);
      u.search = "";
      u.hash = "";
      return u.toString();
    }catch(e){
      return raw;
    }
  }

  function setApiBase(v){
    localStorage.setItem(LS_KEY, normalizeApiBase_(v));
  }

  function jsonp(url){
    return new Promise((resolve, reject) => {
      const cbName = "cb_" + Math.random().toString(36).slice(2);
      const script = document.createElement("script");
      const sep = url.includes("?") ? "&" : "?";
      script.src = url + sep + "callback=" + cbName + "&_=" + Date.now();
      script.onerror = () => {
        cleanup();
        reject(new Error("JSONP load error"));
      };
      window[cbName] = (data) => {
        cleanup();
        resolve(data);
      };
      function cleanup(){
        try { delete window[cbName]; } catch(e) { window[cbName] = undefined; }
        if (script && script.parentNode) script.parentNode.removeChild(script);
      }
      document.body.appendChild(script);
    });
  }

  function api(action, params = {}){
    const base = getApiBase();
    if (!base) return Promise.reject(new Error("Missing API base URL. Open Settings."));
    const u = new URL(base);
    u.search = "";
    u.hash = "";
    u.searchParams.set("action", action);
    for (const [k,v] of Object.entries(params)) {
      if (v !== undefined && v !== null) u.searchParams.set(k, v);
    }
    return jsonp(u.toString());
  }

  function msFromAny_(v){
    try{
      if (!v) return 0;
      if (v instanceof Date) return v.getTime();
      if (typeof v === "number") return v;
      const raw = String(v).trim();
      let t = Date.parse(raw);
      if (!isNaN(t)) return t;
      const m = raw.match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})(?::(\d{2}))?/);
      if (m) return new Date(Number(m[1]), Number(m[2])-1, Number(m[3]), Number(m[4]), Number(m[5]), Number(m[6]||0)).getTime();
      return 0;
    }catch(e){ return 0; }
  }

  function sortNewestFirst_(orders, tab){
    return (orders || []).slice().sort((a,b) => {
      const ta = msForTab_(a, tab);
      const tb = msForTab_(b, tab);
      // Ready tab is operational: oldest waiting first.
      if (tab === "ready" || tab === "dispatch" || tab === "return") return ta - tb;
      return tb - ta;
    });
  }

  function msForTab_(o, tab){
    if (tab === "handled") return msFromAny_(o && (o.HandledAt || o.ReturnedAt || o.ReturnAt || o.ReadyAt || o.CreatedAt));
    if (tab === "return") return msFromAny_(o && (o.ReturnAt || o.ReadyAt || o.DispatchAt || o.CreatedAt));
    if (tab === "dispatch") return msFromAny_(o && (o.DispatchAt || o.CreatedAt));
    if (tab === "ready") return msFromAny_(o && (o.ReadyAt || o.CreatedAt));
    return msFromAny_(o && (o.CreatedAt || o.ReadyAt || o.HandledAt));
  }

  function startOfTodayMs_(){
    const now = new Date();
    return new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  }

  function readyAgeDays_(o){
    const ms = msFromAny_(o && (o.ReadyAt || o.CreatedAt));
    if (!ms) return null;
    const today = startOfTodayMs_();
    const d = new Date(ms);
    const readyDay = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    return Math.max(0, Math.floor((today - readyDay) / 86400000));
  }

  function readyAgeBucket_(o){
    const days = readyAgeDays_(o);
    if (days === null) return "unknown";
    if (days === 0) return "today";
    if (days >= 1 && days <= 3) return "mid";
    return "old";
  }

  function readyAgeLabel_(o){
    const days = readyAgeDays_(o);
    if (days === null) return "Age onbekend";
    if (days === 0) return "Today";
    if (days === 1) return "1 day";
    return days + " days";
  }

  function updateReadyFilterCounts_(){
    const arr = Array.isArray(pools.ready) ? pools.ready : [];
    const counts = { all: arr.length, today: 0, mid: 0, old: 0 };
    arr.forEach(o => {
      const b = readyAgeBucket_(o);
      if (b === "today") counts.today++;
      else if (b === "mid") counts.mid++;
      else if (b === "old") counts.old++;
    });
    const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = String(v); };
    set("rfAll", counts.all);
    set("rfToday", counts.today);
    set("rfMid", counts.mid);
    set("rfOld", counts.old);
  }

  function updateDispatchFilterCounts_(){
    const arr = Array.isArray(pools.dispatch) ? pools.dispatch : [];
    const counts = { all: arr.length, unassigned: 0, assigned: 0 };

    arr.forEach(o => {
      if (String(o && o.CourierId || "").trim()) counts.assigned++;
      else counts.unassigned++;
    });

    const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = String(v); };
    set("dfAll", counts.all);
    set("dfUnassigned", counts.unassigned);
    set("dfAssigned", counts.assigned);
  }

  function renderDispatchCourierFilters_(){
    const wrap = document.getElementById("dispatchCourierFilters");
    if (!wrap) return;

    wrap.innerHTML = "";

    const arr = Array.isArray(pools.dispatch) ? pools.dispatch : [];
    const byCourier = {};

    arr.forEach(o => {
      const id = String(o && o.CourierId || "").trim();
      if (!id) return;
      const name = String(o && o.CourierName || id).trim();
      if (!byCourier[id]) byCourier[id] = { id, name, count: 0 };
      byCourier[id].count++;
    });

    // Use active courier list first, then any courier found in current dispatch data.
    const seen = {};
    (couriers || []).forEach(c => {
      const id = String(c && c.CourierId || "").trim();
      if (!id) return;
      const count = byCourier[id] ? byCourier[id].count : 0;
      if (!count) return;
      seen[id] = true;
      wrap.appendChild(buildDispatchCourierFilterButton_(id, String(c.Name || id), count));
    });

    Object.keys(byCourier).sort((a,b) => byCourier[a].name.localeCompare(byCourier[b].name)).forEach(id => {
      if (seen[id]) return;
      const c = byCourier[id];
      wrap.appendChild(buildDispatchCourierFilterButton_(c.id, c.name, c.count));
    });
  }

  function buildDispatchCourierFilterButton_(courierId, name, count){
    const btn = document.createElement("button");
    btn.className = "filterBtn";
    btn.type = "button";
    btn.setAttribute("data-dispatch-filter", "courier:" + courierId);
    btn.textContent = name + " " + count;
    if (dispatchFilter === "courier:" + courierId) btn.classList.add("active");
    return btn;
  }

  function syncDispatchFilterActiveButtons_(){
    document.querySelectorAll("[data-dispatch-filter]").forEach(b => {
      b.classList.toggle("active", b.getAttribute("data-dispatch-filter") === dispatchFilter);
    });
  }

  function formatSRD(v){
    const n = Number(v || 0);
    return "SRD " + n.toLocaleString("nl-NL", { maximumFractionDigits: 2, useGrouping: false });
  }

  function formatDateDisplay_(s){
    if (!s) return "";
    const raw = String(s).trim();
    if (!raw) return "";
    try{
      const normalized = raw.indexOf("T") >= 0 ? raw : raw.replace(" ", "T");
      const d = new Date(normalized);
      if (!isNaN(d.getTime())) {
        const date = d.toLocaleDateString("nl-NL", { timeZone: "America/Paramaribo" });
        const time = d.toLocaleTimeString("nl-NL", { timeZone: "America/Paramaribo", hour: "2-digit", minute: "2-digit" });
        return `${date} · ${time}`;
      }
      return raw;
    }catch(e){ return raw; }
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
    }[m]));
  }

  function pill(text, kind){
    const span = document.createElement("span");
    span.className = "pill " + (kind || "");
    span.textContent = text;
    return span;
  }

  function normWorkflow_(s){
    const x = String(s || "").trim().toUpperCase();
    if (x === "READY") return "READY";
    if (x === "DISPATCH") return "DISPATCH";
    if (x === "RETURN") return "RETURN";
    if (x === "HANDLED") return "HANDLED";
    return "PICK";
  }

  function tabForWorkflow_(s){
    const st = normWorkflow_(s);
    if (st === "READY") return "ready";
    if (st === "DISPATCH") return "dispatch";
    if (st === "RETURN") return "return";
    if (st === "HANDLED") return "handled";
    return "pick";
  }

  function displayWorkflow_(s){
    const st = normWorkflow_(s);
    if (st === "PICK") return "Pick";
    if (st === "READY") return "Ready";
    if (st === "DISPATCH") return "Dispatch";
    if (st === "RETURN") return "Return";
    return "Handled";
  }



  function normFulfillmentType_(s){
    const x = String(s || "").trim().toUpperCase();
    if (x === "DELIVERY") return "DELIVERY";
    return "PICKUP";
  }

  function displayFulfillmentType_(s){
    return normFulfillmentType_(s) === "DELIVERY" ? "🚚 DELIVERY" : "🏪 PICKUP";
  }


  function markFailedAction_(orderNumber, type, message){
    const ord = String(orderNumber || "").trim();
    if (!ord) return;
    failedActions[ord] = {
      type: type || "SAVE_FAILED",
      message: String(message || "Save failed"),
      time: new Date().toISOString()
    };
    saveFailedActionsToSession_();
  }

  function clearFailedAction_(orderNumber){
    const ord = String(orderNumber || "").trim();
    if (ord && failedActions[ord]) {
      delete failedActions[ord];
      saveFailedActionsToSession_();
    }
  }

  function getFailedAction_(orderNumber){
    const ord = String(orderNumber || "").trim();
    return ord ? (failedActions[ord] || null) : null;
  }

  function saveFailedActionsToSession_(){
    try { sessionStorage.setItem(FAILED_ACTIONS_SS_KEY, JSON.stringify(failedActions)); } catch(e){}
  }

  function loadFailedActionsFromSession_(){
    try{
      const raw = sessionStorage.getItem(FAILED_ACTIONS_SS_KEY);
      if (!raw) return;
      const obj = JSON.parse(raw);
      if (!obj || typeof obj !== "object") return;
      Object.keys(obj).forEach(k => { failedActions[k] = obj[k]; });
    }catch(e){}
  }

  function savePendingCourierAssignmentsToSession_(){
    try { sessionStorage.setItem(PENDING_COURIER_SS_KEY, JSON.stringify(pendingCourierAssignments)); } catch(e){}
  }

  function loadPendingCourierAssignmentsFromSession_(){
    try{
      const raw = sessionStorage.getItem(PENDING_COURIER_SS_KEY);
      if (!raw) return;
      const obj = JSON.parse(raw);
      if (!obj || typeof obj !== "object") return;
      Object.keys(obj).forEach(k => { pendingCourierAssignments[k] = obj[k]; });
    }catch(e){}
  }

  function setPendingCourierAssignment_(orderNumber, patch){
    const ord = String(orderNumber || "").trim();
    if (!ord) return;
    pendingCourierAssignments[ord] = Object.assign({}, patch || {}, {
      PendingCourierAssignment: true
    });
    savePendingCourierAssignmentsToSession_();
  }

  function clearPendingCourierAssignment_(orderNumber){
    const ord = String(orderNumber || "").trim();
    if (ord && pendingCourierAssignments[ord]) {
      delete pendingCourierAssignments[ord];
      savePendingCourierAssignmentsToSession_();
    }
  }

  function getPendingCourierAssignment_(orderNumber){
    const ord = String(orderNumber || "").trim();
    return ord ? (pendingCourierAssignments[ord] || null) : null;
  }

  function applyPendingCourierAssignmentsToOrders_(orders){
    return (orders || []).map(o => {
      const on = String(o && o.OrderNumber || "").trim();
      if (!on) return o;
      const p = getPendingCourierAssignment_(on);
      if (!p) return o;
      return Object.assign({}, o, p, {
        SaveFailed: true
      });
    });
  }


  function isReadySaveFailed_(orderNumber){
    const f = getFailedAction_(orderNumber);
    return !!(f && (f.type === "READY_SAVE_FAILED" || f.type === "DISPATCH_SAVE_FAILED"));
  }


  function failedReadyOrderFromCache_(orderNumber){
    const ord = String(orderNumber || "").trim();
    if (!ord) return null;

    const cached = detailCache.get(ord);
    if (cached) {
      return Object.assign({}, cached, {
        OrderNumber: ord,
        WorkflowStatus: "READY",
        SaveFailed: true,
        DetailPreloaded: true
      });
    }

    return {
      OrderNumber: ord,
      CustomerName: "Save failed - open to retry",
      OrderTotalSRD: 0,
      WorkflowStatus: "READY",
      ReadyAt: new Date().toISOString(),
      SaveFailed: true,
      DetailPreloaded: false,
      Items: [],
      PickChecks: [],
      PickComplete: true
    };
  }

  function failedReadyOrderNumbers_(){
    return Object.keys(failedActions).filter(on => {
      const f = failedActions[on];
      return f && (f.type === "READY_SAVE_FAILED" || f.type === "DISPATCH_SAVE_FAILED");
    });
  }

  function getListEl_(tab){
    if (tab === "ready") return document.getElementById("listReady");
    if (tab === "dispatch") return document.getElementById("listDispatch");
    if (tab === "return") return document.getElementById("listReturn");
    if (tab === "handled") return document.getElementById("listHandled");
    return document.getElementById("listPick");
  }

  function showTabContainers_(tab){
    TABS.forEach(t => {
      const el = getListEl_(t);
      if (el) el.style.display = (t === tab) ? "grid" : "none";
    });
  }

  function updateTabBadge_(tab, count){
    const id = tab === "ready" ? "badgeReady" : tab === "dispatch" ? "badgeDispatch" : tab === "return" ? "badgeReturn" : tab === "handled" ? "badgeHandled" : "badgePick";
    const el = document.getElementById(id);
    if (el) el.textContent = String(typeof count === "number" ? count : 0);
  }

  function updateAllBadges_(){
    TABS.forEach(t => updateTabBadge_(t, Array.isArray(pools[t]) ? pools[t].length : 0));
    updateReadyFilterCounts_();
    updateDispatchFilterCounts_();
    renderDispatchCourierFilters_();
  }

  function setDebug_(msg){
    const el = document.getElementById("debugInfo");
    if (!el) return;
    el.textContent = DEBUG ? (msg || "") : "";
  }

  function getSearchBase_(){
    return pools[currentTab] || [];
  }

  function filterOrders_(orders){
    const q = (searchQuery || "").trim().toLowerCase();
    let arr = orders || [];
    if (currentTab === "ready" && readyFilter !== "all") {
      arr = arr.filter(o => readyAgeBucket_(o) === readyFilter);
    }
    if (currentTab === "dispatch" && dispatchFilter !== "all") {
      if (dispatchFilter === "unassigned") {
        arr = arr.filter(o => !String(o && o.CourierId || "").trim());
      } else if (dispatchFilter === "assigned") {
        arr = arr.filter(o => !!String(o && o.CourierId || "").trim());
      } else if (dispatchFilter.indexOf("courier:") === 0) {
        const cid = dispatchFilter.substring("courier:".length);
        arr = arr.filter(o => String(o && o.CourierId || "").trim() === cid);
      }
    }
    if (!q) return arr;
    return arr.filter(o => {
      const on = String(o.OrderNumber || "").toLowerCase();
      const cn = String(o.CustomerName || "").toLowerCase();
      return on.includes(q) || cn.includes(q);
    });
  }

  function emptyHint_(tab){
    if (tab === "pick") return "📭 Geen orders om te picken.";
    if (tab === "ready") return "✅ Geen ready orders.";
    if (tab === "dispatch") return "🚚 Geen dispatch orders.";
    if (tab === "return") return "✅ Geen retour orders.";
    return "✅ Geen handled orders.";
  }

  function renderList(orders, tab){
    const activeTab = tab || currentTab;
    const list = getListEl_(activeTab);
    if (!list) return;
    list.innerHTML = "";

    if (!orders.length) {
      document.getElementById("hint").textContent = emptyHint_(activeTab);
      return;
    }
    document.getElementById("hint").textContent = "";

    const buildCard_ = (o) => {
      const card = document.createElement("div");
      const workflow = normWorkflow_(o.WorkflowStatus);
      card.className = "card";
      card.dataset.workflow = workflow;
      const failedAction = getFailedAction_(o.OrderNumber);
      if (failedAction) card.classList.add("saveFailed");
      card.onclick = () => openOrder(o.OrderNumber);

      const dateForCard = activeTab === "handled" ? (o.HandledAt || o.ReturnedAt || o.ReturnAt || o.ReadyAt || o.CreatedAt)
        : activeTab === "return" ? (o.ReturnAt || o.ReadyAt || o.DispatchAt || o.CreatedAt)
        : activeTab === "dispatch" ? (o.DispatchAt || o.CreatedAt)
        : activeTab === "ready" ? (o.ReadyAt || o.CreatedAt)
        : o.CreatedAt;

      const pay = String(o.PaymentStatus || "").trim();
      const workflowKind = workflow === "PICK" ? "warn" : workflow === "RETURN" ? "warn" : workflow === "DISPATCH" ? "warn" : "ok";

      card.innerHTML = `
        <div class="cardHead">
          <div class="cardRow1">
            <div class="ordno">${escapeHtml(o.OrderNumber || "")}</div>
            <div class="total">${formatSRD(o.OrderTotalSRD)}</div>
          </div>
          <div class="cardRow2">
            <div class="name">${escapeHtml(o.CustomerName || "")}</div>
            <div class="muted cardDt">${escapeHtml(formatDateDisplay_(dateForCard || ""))}</div>
          </div>
        </div>
      `;

      const pills = document.createElement("div");
      pills.className = "pills";
      pills.appendChild(pill("Workflow: " + displayWorkflow_(workflow), workflowKind));
      const fulfillmentType = normFulfillmentType_(o.FulfillmentType);
      pills.appendChild(pill(displayFulfillmentType_(fulfillmentType), fulfillmentType === "DELIVERY" ? "delivery" : "pickup"));
      if (failedAction) {
        pills.appendChild(pill("Save failed", "bad"));
        pills.appendChild(pill("Tap to retry", "bad"));
      }
      const hasMultiQty = Array.isArray(o.Items) && o.Items.some(it => Number(it && it.qty || 1) > 1);
      if (hasMultiQty) pills.appendChild(pill("⚠ Meerdere stuks", "bad"));
      if (workflow === "READY") {
        const age = document.createElement("span");
        const bucket = readyAgeBucket_(o);
        age.className = "pill ageBadge " + (bucket === "today" ? "today" : bucket === "mid" ? "mid" : bucket === "old" ? "old" : "");
        age.textContent = "Waiting: " + readyAgeLabel_(o);
        pills.appendChild(age);
      }
      if (o.CourierName) pills.appendChild(pill("Courier: " + o.CourierName, "delivery"));
      if (o.PendingCourierAssignment) pills.appendChild(pill("Courier save failed", "bad"));
      if (o.DeliveryStatus) pills.appendChild(pill("Delivery: " + o.DeliveryStatus, "warn"));
      if (pay) pills.appendChild(pill("Pay: " + pay, pay === "Paid" ? "ok" : pay === "Unpaid" ? "warn" : ""));
      if (workflow === "READY" && o.ReadyBy) pills.appendChild(pill("Door: " + o.ReadyBy, ""));
      if (workflow === "RETURN" && o.HandledSource) pills.appendChild(pill("Reden: " + o.HandledSource, "warn"));
      if (workflow === "HANDLED" && o.HandledSource) pills.appendChild(pill("Source: " + o.HandledSource, ""));
      card.appendChild(pills);

      return card;
    };

    const groups = new Map();
    (orders || []).forEach(o => {
      const ms = msForTab_(o, activeTab);
      let k = "Onbekende datum";
      if (ms) {
        const d = new Date(ms);
        k = d.toLocaleDateString("en-CA", { timeZone: "America/Paramaribo" });
      }
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(o);
    });

    const dayLabel_ = (yyyy_mm_dd) => {
      try{
        if (yyyy_mm_dd === "Onbekende datum") return yyyy_mm_dd;
        const [y,m,da] = yyyy_mm_dd.split("-").map(Number);
        const dt = new Date(Date.UTC(y, (m||1)-1, da||1, 12, 0, 0));
        return dt.toLocaleDateString("nl-NL", { timeZone: "America/Paramaribo", weekday: "long", year: "numeric", month: "long", day: "numeric" });
      }catch(e){ return yyyy_mm_dd; }
    };

    const keys = Array.from(groups.keys()).sort((a,b) => {
      if (a === "Onbekende datum" && b === "Onbekende datum") return 0;
      if (a === "Onbekende datum") return 1;
      if (b === "Onbekende datum") return -1;
      // Ready tab: oldest date first. Others: newest date first.
      if (activeTab === "ready" || activeTab === "dispatch" || activeTab === "return") return (a > b) ? 1 : (a < b ? -1 : 0);
      return (a < b) ? 1 : (a > b ? -1 : 0);
    });

    keys.forEach(k => {
      const arr = groups.get(k) || [];
      arr.sort((a,b) => {
        if (activeTab === "ready" || activeTab === "dispatch" || activeTab === "return") return msForTab_(a, activeTab) - msForTab_(b, activeTab);
        return msForTab_(b, activeTab) - msForTab_(a, activeTab);
      });

      const header = document.createElement("div");
      header.className = "dayGroupHeader";
      header.setAttribute("role", "button");
      header.setAttribute("tabindex", "0");

      const collapseKey = `pq_collapsed_${activeTab}_${k}`;
      const collapsed = sessionStorage.getItem(collapseKey) === "1";
      header.innerHTML = `
        <div class="dayGroupLeft">
          <span class="dayGroupChevron ${collapsed ? "collapsed" : ""}">▾</span>
          <span class="dayGroupTitle">${escapeHtml(dayLabel_(k))}</span>
        </div>
        <div class="dayGroupMeta">${arr.length} order(s)</div>
      `;
      list.appendChild(header);

      const body = document.createElement("div");
      body.className = "dayGroupBody";
      body.style.display = collapsed ? "none" : "block";
      list.appendChild(body);

      arr.forEach(o => body.appendChild(buildCard_(o)));

      const toggle_ = () => {
        const nowCollapsed = body.style.display !== "none";
        body.style.display = nowCollapsed ? "none" : "block";
        const chev = header.querySelector(".dayGroupChevron");
        if (chev) chev.classList.toggle("collapsed", nowCollapsed);
        sessionStorage.setItem(collapseKey, nowCollapsed ? "1" : "0");
      };

      header.addEventListener("click", toggle_);
      header.addEventListener("keydown", ev => {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); toggle_(); }
      });
    });
  }

  function renderCurrent_(){
    const tab = currentTab;
    showTabContainers_(tab);
    const sig = tab + "|" + ((searchQuery || "").trim()) + "|" + (tab === "ready" ? readyFilter : "") + "|" + (tab === "dispatch" ? dispatchFilter : "") + "|" + String(versions[tab]);
    const listEl = getListEl_(tab);
    if (listEl && renderSigByTab[tab] === sig && listEl.dataset.rendered === "1") return;

    const orders = filterOrders_(getSearchBase_());
    renderList(orders, tab);
    if (listEl) listEl.dataset.rendered = "1";
    renderSigByTab[tab] = sig;

    if (tab === "ready") updateReadyFilterCounts_();
    if (tab === "dispatch") {
      updateDispatchFilterCounts_();
      renderDispatchCourierFilters_();
      syncDispatchFilterActiveButtons_();
    }
    setDebug_(`tab=${tab} • total=${orders.length} • q="${searchQuery}"`);
  }

  async function ensureTabData_(tab, force = false){
    if (!force && !dirty[tab] && cachesLoaded[tab]) return;
    if (loading[tab]) return loading[tab];

    loading[tab] = (async () => {
      const res = await api(ACTION_BY_TAB[tab]);
      if (!res || !res.ok) throw new Error((res && res.error) || "API error (" + ACTION_BY_TAB[tab] + ")");
      let incoming = sortNewestFirst_(applyPendingCourierAssignmentsToOrders_(res.orders || []), tab);

      // Failed READY saves must stay visually in Ready after refresh, even if sheet still says PICK.
      const failedReady = {};
      failedReadyOrderNumbers_().forEach(on => { failedReady[on] = true; });

      if (tab === "pick") {
        incoming = incoming.filter(o => !failedReady[String(o && o.OrderNumber || "").trim()]);
      }

      if (tab === "ready") {
        const incomingKeys = {};
        incoming.forEach(o => { incomingKeys[String(o && o.OrderNumber || "").trim()] = true; });

        // Preserve live local ready failed orders.
        (pools.ready || []).forEach(localOrder => {
          const on = String(localOrder && localOrder.OrderNumber || "").trim();
          if (on && failedReady[on] && !incomingKeys[on]) {
            incoming.unshift(localOrder);
            incomingKeys[on] = true;
          }
        });

        // Also restore failed ready orders from session/detail cache after page refresh.
        failedReadyOrderNumbers_().forEach(on => {
          if (!incomingKeys[on]) {
            const restored = failedReadyOrderFromCache_(on);
            if (restored) {
              incoming.unshift(restored);
              incomingKeys[on] = true;
            }
          }
        });
      }

      pools[tab] = sortNewestFirst_(incoming, tab);
      seedDetailCacheFromList_(pools[tab]);
      cachesLoaded[tab] = true;
      dirty[tab] = false;
      versions[tab]++;
      renderSigByTab[tab] = null;
      updateTabBadge_(tab, pools[tab].length);
      if (tab === "ready") updateReadyFilterCounts_();
      if (tab === "dispatch") {
        updateDispatchFilterCounts_();
        renderDispatchCourierFilters_();
        syncDispatchFilterActiveButtons_();
      }
    })();

    try { await loading[tab]; }
    finally { loading[tab] = null; }
  }

  async function loadCurrentTab_(opts = {}){
    const force = !!opts.force;
    const showSpinner = !!opts.showSpinner;
    const btn = document.getElementById("btnRefresh");

    if (showSpinner && btn) { btn.classList.add("loading"); btn.disabled = true; }

    try{
      await ensureTabData_(currentTab, force);
      renderCurrent_();
      // Details are preloaded in the tab list response. No separate getOrder prefetch needed.
    }finally{
      if (showSpinner && btn) { btn.classList.remove("loading"); btn.disabled = false; }
    }
  }

  async function loadOperationalTabs_(force = false, showSpinner = false){
    const btn = document.getElementById("btnRefresh");
    if (showSpinner && btn) { btn.classList.add("loading"); btn.disabled = true; }

    try{
      await Promise.all([
        ensureTabData_("pick", force),
        ensureTabData_("ready", force),
        ensureTabData_("dispatch", force),
        ensureTabData_("return", force)
      ]);

      updateAllBadges_();
      renderCurrent_();

    }finally{
      if (showSpinner && btn) { btn.classList.remove("loading"); btn.disabled = false; }
    }
  }

  async function safeLoadOrders(force = true){
    try{
      if (currentTab === "handled") {
        await loadCurrentTab_({ force: !!force, showSpinner: true });
      } else {
        await loadOperationalTabs_(!!force, true);
      }
      backgroundRefreshCounts_();
    }catch(e){
      document.getElementById("hint").textContent = "Error loading orders: " + (e.message || String(e));
      TABS.forEach(t => { const el = getListEl_(t); if (el) el.innerHTML = ""; });
    }
  }

  function setTab(tab){
    const next = TABS.includes(tab) ? tab : "pick";
    currentTab = next;

    document.getElementById("tabPick").classList.toggle("active", currentTab === "pick");
    document.getElementById("tabReady").classList.toggle("active", currentTab === "ready");
    document.getElementById("tabDispatch").classList.toggle("active", currentTab === "dispatch");
    document.getElementById("tabReturn").classList.toggle("active", currentTab === "return");
    document.getElementById("tabHandled").classList.toggle("active", currentTab === "handled");

    showTabContainers_(currentTab);
    const rf = document.getElementById("readyFilters");
    if (rf) rf.style.display = currentTab === "ready" ? "flex" : "none";

  async function quietRefreshTab_(tab){
    if (!["pick","ready","dispatch","return"].includes(tab)) return;
    if (loading[tab]) return loading[tab];

    loading[tab] = (async () => {
      const action = ACTION_BY_TAB[tab];
      const res = await api(action);
      if (!res || !res.ok) throw new Error((res && res.error) || "API error (" + action + ")");

      let incoming = sortNewestFirst_(applyPendingCourierAssignmentsToOrders_(res.orders || []), tab);

      // Failed READY saves must stay visually in Ready after refresh, even if sheet still says PICK.
      const failedReady = {};
      failedReadyOrderNumbers_().forEach(on => { failedReady[on] = true; });

      if (tab === "pick") {
        incoming = incoming.filter(o => !failedReady[String(o && o.OrderNumber || "").trim()]);
      }

      if (tab === "ready") {
        const incomingKeys = {};
        incoming.forEach(o => { incomingKeys[String(o && o.OrderNumber || "").trim()] = true; });

        // Preserve live local ready failed orders.
        (pools.ready || []).forEach(localOrder => {
          const on = String(localOrder && localOrder.OrderNumber || "").trim();
          if (on && failedReady[on] && !incomingKeys[on]) {
            incoming.unshift(localOrder);
            incomingKeys[on] = true;
          }
        });

        // Also restore failed ready orders from session/detail cache after page refresh.
        failedReadyOrderNumbers_().forEach(on => {
          if (!incomingKeys[on]) {
            const restored = failedReadyOrderFromCache_(on);
            if (restored) {
              incoming.unshift(restored);
              incomingKeys[on] = true;
            }
          }
        });
      }

      pools[tab] = sortNewestFirst_(incoming, tab);
      seedDetailCacheFromList_(pools[tab]);
      cachesLoaded[tab] = true;
      dirty[tab] = false;
      versions[tab]++;
      renderSigByTab[tab] = null;

      updateTabBadge_(tab, pools[tab].length);
      if (tab === "ready") updateReadyFilterCounts_();
      if (tab === "dispatch") {
        updateDispatchFilterCounts_();
        renderDispatchCourierFilters_();
        syncDispatchFilterActiveButtons_();
      }

      const modalOpen = document.getElementById("orderModal") && document.getElementById("orderModal").classList.contains("show");
      if (tab === currentTab && !modalOpen) renderCurrent_();
    })();

    try { await loading[tab]; }
    finally { loading[tab] = null; }
  }

  async function backgroundSyncOperationalTabs_(){
    if (backgroundSyncRunning) return;
    if (!getApiBase()) return;

    backgroundSyncRunning = true;
    try{
      await Promise.all([
        quietRefreshTab_("pick").catch(()=>{}),
        quietRefreshTab_("ready").catch(()=>{}),
        quietRefreshTab_("dispatch").catch(()=>{}),
        quietRefreshTab_("return").catch(()=>{})
      ]);
      setDebug_("background sync ok • " + new Date().toLocaleTimeString("nl-NL", { hour:"2-digit", minute:"2-digit", second:"2-digit" }));
    }finally{
      backgroundSyncRunning = false;
    }
  }

  function startBackgroundSync_(){
    if (backgroundSyncTimer) clearInterval(backgroundSyncTimer);
    backgroundSyncTimer = setInterval(backgroundSyncOperationalTabs_, BACKGROUND_SYNC_MS);
  }

    if (typeof options === "object") {

    return out;

  async function assignCourierForCurrentOrder_(){
    if (!currentOrder) throw new Error("No order selected");

    const orderNumber = String(currentOrder.OrderNumber || "").trim();
    if (!orderNumber) throw new Error("Missing OrderNumber");

    const sel = document.getElementById("courierSelect");
    const courierId = sel ? String(sel.value || "").trim() : "";
    if (!courierId) throw new Error("Select courier first");

    const courier = couriers.find(c => String(c.CourierId || "").trim() === courierId);
    if (!courier) throw new Error("Selected courier not found or inactive");

    const resEl = document.getElementById("odActionResult");
    if (resEl) resEl.textContent = "Assigning courier…";

    const patch = {
      CourierId: courier.CourierId,
      CourierName: courier.Name,
      CourierPhone: courier.Phone || "",
      DeliveryStatus: "DISPATCHED_TO_COURIER",
      DispatchedAt: new Date().toISOString(),
      DispatchedBy: "PickQueue",
      PendingCourierAssignment: true
    };

    // Operational truth: keep courier assignment visible even if API fails.
    setPendingCourierAssignment_(orderNumber, patch);
    markFailedAction_(orderNumber, "COURIER_ASSIGN_PENDING", "Courier assignment pending save");

    Object.assign(currentOrder, patch);
    updateOrderInCaches_(orderNumber, Object.assign({}, patch, { SaveFailed: false }));
    setCachedOrderDetail_(currentOrder);
    renderCurrent_();
    applyOrderToModal_(currentOrder);

    api("assignCourier", {
      orderNumber,
      courierId,
      source: "PickQueue"
    }).then(res => {
      if (!res || !res.ok) throw new Error((res && res.error) || "Failed to assign courier");

      const finalPatch = {
        CourierId: res.CourierId || courier.CourierId,
        CourierName: res.CourierName || courier.Name,
        CourierPhone: res.CourierPhone || courier.Phone || "",
        DeliveryStatus: res.DeliveryStatus || "DISPATCHED_TO_COURIER",
        DispatchedAt: res.DispatchedAt || patch.DispatchedAt,
        DispatchedBy: res.DispatchedBy || "PickQueue",
        PendingCourierAssignment: false,
        SaveFailed: false
      };

      clearPendingCourierAssignment_(orderNumber);
      clearFailedAction_(orderNumber);

      Object.assign(currentOrder, finalPatch);
      updateOrderInCaches_(orderNumber, finalPatch);
      setCachedOrderDetail_(currentOrder);

      if (resEl) resEl.textContent = "Courier assigned: " + finalPatch.CourierName;
      renderCurrent_();
      applyOrderToModal_(currentOrder);

    }).catch(e => {
      const failedPatch = Object.assign({}, patch, {
        PendingCourierAssignment: true,
        SaveFailed: true
      });

      setPendingCourierAssignment_(orderNumber, failedPatch);
      markFailedAction_(orderNumber, "COURIER_ASSIGN_FAILED", e.message || String(e));

      Object.assign(currentOrder, failedPatch);
      updateOrderInCaches_(orderNumber, failedPatch);
      setCachedOrderDetail_(currentOrder);

      if (resEl) resEl.textContent = "❌ Courier assignment failed to save. The assignment stays visible. Press Retry Courier Save.";
      renderCurrent_();
      applyOrderToModal_(currentOrder);
    });
  }

        DeliveryStatus: res.DeliveryStatus || "AWAITING_COURIER_ASSIGNMENT",

  async function printCurrentOrderLabel_(){
    if (!currentOrder) throw new Error("No order selected");

    var orderNumber = String(currentOrder.OrderNumber || "").trim();
    var orderToPrint = currentOrder;

    try{
      var fresh = await prefetchOrderDetail_(orderNumber, true);
      if (fresh) {
        currentOrder = fresh;
        initPickState_(fresh);
        applyOrderToModal_(fresh);
        orderToPrint = fresh;
      }
    }catch(e){
      // Print with cached/current data if refresh fails.
    }

    var labelHtml = buildPrintLabelHtml_(orderToPrint);

    // Use a Blob URL instead of document.write. This is more reliable across browsers
    // and avoids blank popups caused by document stream timing.
    var blob = new Blob([labelHtml], { type: "text/html;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var w = window.open(url, "_blank", "width=420,height=720");

    if (!w) {
      URL.revokeObjectURL(url);
      throw new Error("Popup blocked. Allow popups for this page to print labels.");
    }

    // Revoke later; immediate revoke can blank the new window in some browsers.
    setTimeout(function(){
      try { URL.revokeObjectURL(url); } catch(e){}
    }, 60000);
  }

  function updateOrderActionsUI_(){
    const hint = document.getElementById("odStatusHint");
    const btn = document.getElementById("btnMarkReady");
    const courierSelect = document.getElementById("courierSelect");
    const btnAssignCourier = document.getElementById("btnAssignCourier");
    const btnUnassignCourier = document.getElementById("btnUnassignCourier");

    if (courierSelect) courierSelect.style.display = "none";
    if (btnAssignCourier) btnAssignCourier.style.display = "none";
    if (btnUnassignCourier) btnUnassignCourier.style.display = "none";

    if (!currentOrder) {
      hint.textContent = "—";
      btn.disabled = true;
      return;
    }

    const workflow = normWorkflow_(currentOrder.WorkflowStatus);
    const pickComplete = pickCompleteNow_();
    currentOrder.PickComplete = pickComplete;

    hint.textContent = `Workflow: ${displayWorkflow_(workflow)}` + (pickComplete ? " • PickComplete ✅" : " • PickComplete ❌");

    if (workflow === "PICK") {
      sec.style.display = "block";
      btn.textContent = normFulfillmentType_(currentOrder.FulfillmentType) === "DELIVERY" ? "Markeer als Dispatch" : "Markeer als Ready";
      btn.disabled = !pickComplete;
    } else if (workflow === "READY" && isReadySaveFailed_(currentOrder.OrderNumber)) {
      sec.style.display = "block";
      btn.textContent = "Retry Ready save";
      btn.disabled = !pickComplete;
    } else if (workflow === "DISPATCH") {
      sec.style.display = "block";
      btn.textContent = "Al Dispatch";
      btn.disabled = true;
      if (courierSelect) {
        courierSelect.style.display = "inline-block";
        populateCourierSelect_(currentOrder.CourierId || "");
      }
      if (btnAssignCourier) {
        btnAssignCourier.style.display = "inline-block";
        btnAssignCourier.textContent = getFailedAction_(currentOrder.OrderNumber) && getFailedAction_(currentOrder.OrderNumber).type === "COURIER_ASSIGN_FAILED"
          ? "Retry Courier Save"
          : currentOrder.CourierId ? "Reassign Courier" : "Assign Courier";
      }
      if (btnUnassignCourier && currentOrder.CourierId) {
        btnUnassignCourier.style.display = "inline-block";

  async function openOrder(orderNumber){

        applyOrderToModal_(currentOrder);

        // Always refresh opened order from server. This prevents stale cached PICK details
        // from hiding DISPATCH courier controls after a delivery order was routed.
        prefetchOrderDetail_(orderNumber, true).then(fresh => {
          if (fresh && currentOrder && currentOrder.OrderNumber === fresh.OrderNumber) {
            currentOrder = fresh;
            initPickState_(fresh);
            applyOrderToModal_(fresh);

  function initPickState_(orderObj){
    const items = Array.isArray(orderObj && orderObj.Items) ? orderObj.Items : [];

    if (orderObj) orderObj.PickChecks = pickChecks;

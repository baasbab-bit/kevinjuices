<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Courier Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      --header:#075E54;
      --accent:#25D366;
      --accent2:#128C7E;
      --bg:#E9F5EF;
      --card:#fff;
      --text:#0b1b14;
      --muted:rgba(11,27,20,.62);
      --border:rgba(11,27,20,.10);
      --shadow:0 8px 24px rgba(0,0,0,.08);
      --danger:#dc2626;
      --warn:#f97316;
      --blue:#2563eb;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
    header{
      position:sticky;top:0;z-index:20;
      background:linear-gradient(90deg,var(--header),var(--accent2));
      color:#fff;padding:10px 12px;display:flex;gap:8px;align-items:center;
    }
    h1{font-size:16px;margin:0;font-weight:700;}
    .grow{flex:1;}
    .muted{font-size:12px;color:var(--muted);}
    header .muted{color:rgba(255,255,255,.88);font-weight:800;}
    header .btn{
      background:#fff;
      border-color:rgba(255,255,255,.75);
      color:#0b1b14;
      box-shadow:0 2px 8px rgba(0,0,0,.12);
    }
    .wrap{padding:12px;max-width:760px;margin:0 auto;}
    .card{
      background:var(--card);border:1px solid var(--border);border-radius:18px;
      box-shadow:var(--shadow);padding:14px;margin-bottom:12px;
    }
    .btn{
      border:1px solid #ddd;background:#fff;padding:10px 12px;border-radius:14px;
      cursor:pointer;font-weight:700;font-size:14px;text-decoration:none;color:inherit;
      display:inline-flex;align-items:center;justify-content:center;gap:6px;
      min-height:44px;
    }
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#0b2b22;}
    .btn.blue{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8;}
    .btn.warn{background:#fff7ed;border-color:#fed7aa;color:#9a3412;}
    .btn.bad{background:#fef2f2;border-color:#fecaca;color:#991b1b;}
    .btn[disabled]{opacity:.5;cursor:not-allowed;}
    .input{
      padding:11px 12px;border:1px solid #ddd;border-radius:14px;background:#fff;
      width:100%;font-weight:500;font-size:16px;min-height:46px;
    }
    .loginBox{display:grid;gap:10px;}
    .loginTitle{font-size:20px;font-weight:700;margin:0 0 4px;}
    .pinInput{text-align:center;letter-spacing:6px;font-size:24px;font-weight:700;}
    .topLine{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
    .courierName{font-weight:700;font-size:15px;}
    .orderNo{font-weight:700;font-size:18px;letter-spacing:.2px;}
    .customer{font-weight:700;font-size:19px;margin-top:10px;line-height:1.15;}
    .phone{font-weight:600;margin-top:4px;font-size:15px;}
    .addressBox{
      margin-top:12px;padding:12px;border-radius:14px;background:#f8fafc;
      border:1px solid rgba(0,0,0,.07);
    }
    .addressMain{font-size:17px;font-weight:700;line-height:1.25;}
    .addressSub{font-size:13px;color:var(--muted);font-weight:500;margin-top:4px;}
    .dueBox{
      margin-top:12px;border-radius:16px;padding:14px;background:#111827;color:#fff;
      display:flex;justify-content:space-between;align-items:center;gap:10px;
    }
    .dueAmount{font-size:26px;font-weight:700;letter-spacing:.2px;}
    .dueLabel{font-size:12px;font-weight:700;color:rgba(255,255,255,.78);text-transform:uppercase;}
    .pill{
      display:inline-flex;align-items:center;border:1px solid rgba(11,27,20,.12);
      padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.72);
      font-size:12px;font-weight:700;margin-top:8px;
    }
    .pill.ok{border-color:rgba(37,211,102,.35);background:rgba(37,211,102,.12);color:#166534;}
    .pill.warn{border-color:rgba(255,194,66,.45);background:rgba(255,194,66,.14);color:#9a3412;}
    .pill.bad{border-color:rgba(231,76,60,.40);background:rgba(231,76,60,.12);color:#991b1b;}
    .quickActions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
    .quickActions .btn{
      flex-direction:column;
      gap:4px;
      min-height:72px;
      font-size:12px;
      line-height:1.1;
    }
    .quickIcon{
      width:28px;
      height:28px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#1d4ed8;
    }
    .quickSvg{
      width:28px;
      height:28px;
      display:block;
      stroke:currentColor;
      fill:none;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }
    .quickLabel{
      font-size:12px;
      font-weight:700;
    }
    .outcomeActions{display:grid;grid-template-columns:1fr;gap:9px;margin-top:12px;}
    .outcomeActions .btn{width:100%;font-size:15px;}
    .deliveryCard{padding:14px 14px 16px;}
    .hidden{display:none!important;}
    .settingsPanel{display:none;}
    .settingsPanel.show{display:block;}
    .empty{padding:24px;text-align:center;color:var(--muted);font-weight:600;}
    @media(min-width:720px){
      .orders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
      .card{margin-bottom:0;}
      .wrap{padding:16px;}
    }
    @media(max-width:480px){
      header .muted{display:none;}
      .quickActions{grid-template-columns:1fr 1fr 1fr;}
      .btn{font-size:13px;padding:9px 8px;}
      .dueAmount{font-size:24px;}
    }
  
    /* Typography hierarchy */
    .orderNo{font-weight:700;}
    .customer{font-weight:700;}
    .phone{font-weight:500;}
    .addressMain{font-weight:600;}
    .addressSub{font-weight:500;}
    .dueAmount{font-weight:800;}
    .dueLabel{font-weight:600;letter-spacing:.35px;}
    .btn{font-weight:700;}
    .quickLabel{font-weight:600;}
    .outcomeActions .btn{font-weight:700;letter-spacing:.2px;}
    .pill{font-weight:600;}
    .courierName{font-weight:700;}
    .loginTitle{font-weight:700;}
    .pinInput{font-weight:700;}


    .earningsGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
    .earnBox{border:1px solid rgba(0,0,0,.08);background:#f8fafc;border-radius:14px;padding:10px;text-align:center;}
    .earnValue{font-size:17px;font-weight:800;}
    .earnLabel{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px;}
    .feeBox{margin-top:8px;border-radius:14px;padding:10px;background:rgba(37,211,102,.12);border:1px solid rgba(37,211,102,.32);display:flex;justify-content:space-between;align-items:center;gap:10px;}
    .feeAmount{font-size:18px;font-weight:800;color:#166534;}
    .feeLabel{font-size:11px;color:#166534;font-weight:700;text-transform:uppercase;letter-spacing:.25px;}
    .noteBox{margin-top:10px;}
    .noteInput{min-height:44px;font-size:14px;font-weight:500;}

    .portalTabs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0 12px;}
    .portalTab{border:1px solid rgba(0,0,0,.1);background:#fff;border-radius:999px;padding:10px 8px;font-weight:700;cursor:pointer;touch-action:manipulation;}
    .portalTab.active{background:#0f172a;color:#fff;border-color:#0f172a;}
    .historyActions{display:flex;gap:8px;margin:8px 0 12px;}
    .historyActions .btn{flex:1;}

</style>
</head>
<body>
<header>
  <h1>Courier Portal</h1>
  <div class="grow"></div>
  <span class="muted" id="buildInfo">not connected</span>
  <button class="btn" id="btnRefresh">Refresh</button>
  <button class="btn" id="btnSettings">Settings</button>
</header>

<div class="wrap">
  <div class="card settingsPanel" id="settingsCard">
    <div class="loginBox">
      <div>
        <div class="muted">API URL</div>
        <input class="input" id="apiBase" placeholder="https://script.google.com/macros/s/.../exec">
      </div>
      <button class="btn primary" id="btnSaveApi">Save API URL</button>
      <button class="btn" id="btnPing">Test Connection</button>
      <button class="btn bad" id="btnLogout">Logout / Switch Courier</button>
    </div>
    <div class="muted" id="settingsMsg" style="margin-top:8px;"></div>
  </div>

  <div class="card" id="loginCard">
    <div class="loginBox">
      <div>
        <h2 class="loginTitle">Courier Login</h2>
        <div class="muted">Enter your courier PIN</div>
      </div>
      <input class="input pinInput" id="pinInput" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="PIN">
      <button class="btn primary" id="btnLogin">Login</button>
    </div>
    <div class="muted" id="loginMsg" style="margin-top:8px;"></div>
  </div>

  <div class="card hidden" id="sessionCard">
    <div class="topLine">
      <div>
        <div class="muted">Logged in as</div>
        <div class="courierName" id="sessionCourier">Courier</div>
      </div>
      <div class="grow"></div>
      <div class="pill warn" id="deliveryCount">0 deliveries</div>
    </div>
    <div class="earningsGrid">
      <div class="earnBox"><div class="earnValue" id="earnedToday">SRD 0</div><div class="earnLabel">Earned</div></div>
      <div class="earnBox"><div class="earnValue" id="potentialEarnings">SRD 0</div><div class="earnLabel">Potential</div></div>
      <div class="earnBox"><div class="earnValue" id="remainingDeliveries">0</div><div class="earnLabel">Remaining</div></div>
    </div>
  </div>



  <div class="portalTabs hidden" id="portalTabs">
    <button type="button" class="portalTab active" data-view="active">Active</button>
    <button type="button" class="portalTab" data-view="history">History</button>
  </div>

  <div class="historyActions hidden" id="historyActions">
    <button type="button" class="btn" data-days="7">7 Days</button>
    <button type="button" class="btn primary" data-days="30">30 Days</button>
    <button type="button" class="btn" data-days="90">90 Days</button>
  </div>

  <div class="muted" id="hint" style="margin:8px 2px 10px;"></div>
  <div class="orders" id="orders"></div>
</div>

<script>
  // GitHub-hosted frontend. This page calls the Apps Script Web App API via JSONP.
  const LS_API = "pq_api_base_v2";
  const DEFAULT_API_URL = "https://script.google.com/macros/s/AKfycbzCT1sw5n6vPA1vW3kE0BwdY4IIr_WPoZj7nx-OmMBsXAOFQFCBUt7I2SfFjmxPqXUW/exec";
  const LS_SESSION = "pq_courier_portal_session_v2";
  const LS_ORDER_CACHE = "pq_courier_orders_cache_v1";
  const LS_HISTORY_CACHE = "pq_courier_history_cache_v1";

  let sessionCourier = null;
  let activeOrders = [];
  let historyOrders = [];
  let currentView = "active";
  let historyDays = 30;

  function getApiBase(){
    return (localStorage.getItem(LS_API) || DEFAULT_API_URL).trim();
  }

  function setApiBase(v){
    const value = String(v || "").trim();
    if (!value || value === DEFAULT_API_URL) {
      localStorage.removeItem(LS_API);
      return;
    }
    localStorage.setItem(LS_API, value);
  }

  function saveSession(courier){
    sessionCourier = courier || null;
    if (sessionCourier) localStorage.setItem(LS_SESSION, JSON.stringify(sessionCourier));
    else localStorage.removeItem(LS_SESSION);
  }

  function loadSession(){
    try{
      const raw = localStorage.getItem(LS_SESSION);
      if (!raw) return null;
      const obj = JSON.parse(raw);
      return obj && obj.CourierId ? obj : null;
    }catch(e){ return null; }
  }

  function jsonp(url){
    return new Promise((resolve,reject)=>{
      const cb = "cb_" + Math.random().toString(36).slice(2);
      const s = document.createElement("script");
      const sep = url.indexOf("?") >= 0 ? "&" : "?";
      s.src = url + sep + "callback=" + cb + "&_=" + Date.now();
      s.onerror = () => { cleanup(); reject(new Error("JSONP load error")); };
      window[cb] = data => { cleanup(); resolve(data); };
      function cleanup(){
        try{ delete window[cb]; }catch(e){ window[cb] = undefined; }
        if (s && s.parentNode) s.parentNode.removeChild(s);
      }
      document.body.appendChild(s);
    });
  }

  function api(action, params = {}){
    const base = getApiBase();
    if (!base) return Promise.reject(new Error("Missing API URL. Open Settings."));
    const u = new URL(base);
    u.search = "";
    u.hash = "";
    u.searchParams.set("action", action);
    Object.entries(params || {}).forEach(([k,v]) => {
      if (v !== undefined && v !== null) u.searchParams.set(k, v);
    });
    return jsonp(u.toString());
  }

  function escapeHtml(s){
    return String(s || "").replace(/[&<>"']/g, m => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
    }[m]));
  }

  function digitsOnly(s){
    return String(s || "").replace(/\D/g, "");
  }

  function phoneHref(phone){
    const d = digitsOnly(phone);
    if (!d) return "#";
    return "tel:+" + d;
  }

  function whatsappHref(phone){
    const d = digitsOnly(phone);
    if (!d) return "#";
    return "https://wa.me/" + d;
  }

  function mapsHref(address){
    const q = String(address || "").trim();
    if (!q) return "#";
    return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
  }


  function courierWhatsAppMessage_(order){
    const name = String(order && order.CustomerName || "").trim();
    const orderNumber = String(order && order.OrderNumber || "").trim();
    const amountDue = order && order.AmountDue !== "" && order.AmountDue !== null && order.AmountDue !== undefined
      ? formatSRD(order.AmountDue)
      : formatSRD(order && order.OrderTotalSRD);

    return [
      "Goedendag" + (name ? " " + name : "") + ",",
      "",
      "Ik ben onderweg met uw bestelling #" + orderNumber + ".",
      "",
      "Openstaand bedrag: " + amountDue,
      "",
      "Bent u beschikbaar om de bestelling in ontvangst te nemen?",
      "",
      "Alvast bedankt."
    ].join("\n");
  }

  function whatsappHrefForOrder_(order){
    const d = digitsOnly(order && order.CustomerPhone);
    if (!d) return "#";
    return "https://wa.me/" + d + "?text=" + encodeURIComponent(courierWhatsAppMessage_(order));
  }


  function formatSRD(v){
    if (v === "" || v === null || v === undefined) return "SRD 0";
    const n = Number(v || 0);
    return "SRD " + n.toLocaleString("nl-NL", { maximumFractionDigits:2, useGrouping:false });
  }

  function deliveryStatusLabel(s){
    const x = String(s || "").toUpperCase();
    if (x === "DELIVERED_REPORTED") return "Delivered";
    if (x === "NO_RESPONSE") return "No Response";
    if (x === "CUSTOMER_NOT_AVAILABLE" || x === "CUSTOMER_NOT_HOME") return "Customer Not Available";
    if (x === "FAILED_ATTEMPT") return "No Response";
    return "Assigned";
  }

  function statusKind(s){
    const x = String(s || "").toUpperCase();
    if (x === "DELIVERED_REPORTED") return "ok";
    if (x === "NO_RESPONSE" || x === "CUSTOMER_NOT_AVAILABLE" || x === "CUSTOMER_NOT_HOME" || x === "FAILED_ATTEMPT") return "bad";
    return "warn";
  }

  function isDeliveredStatus_(s){
    return String(s || "").toUpperCase() === "DELIVERED_REPORTED";
  }

  function courierFeeValue_(order){
    return Number(order && order.CourierFee || 0);
  }

  function assignedTimeLabel_(order){
    const raw = String(order && (order.DispatchAt || order.DispatchedAt || "") || "").trim();
    return raw ? "Assigned " + raw : "Assigned";
  }

  function setHint(msg){
    document.getElementById("hint").textContent = msg || "";
  }

  function updateSessionUI(){
    const loggedIn = !!(sessionCourier && sessionCourier.CourierId);
    document.getElementById("loginCard").classList.toggle("hidden", loggedIn);
    document.getElementById("sessionCard").classList.toggle("hidden", !loggedIn);
    const tabs = document.getElementById("portalTabs");
    if (tabs) tabs.classList.toggle("hidden", !loggedIn);
    const hist = document.getElementById("historyActions");
    if (hist) hist.classList.toggle("hidden", !loggedIn || currentView !== "history");
    if (loggedIn) document.getElementById("sessionCourier").textContent = sessionCourier.Name || sessionCourier.CourierId;
  }


  function courierCacheKey_(){
    return LS_ORDER_CACHE + "_" + String(sessionCourier && sessionCourier.CourierId || "").trim();
  }

  function saveOrdersCache_(orders){
    try{
      if (!sessionCourier || !sessionCourier.CourierId) return;
      const payload = {
        courier: sessionCourier,
        orders: Array.isArray(orders) ? orders : [],
        cachedAt: new Date().toISOString()
      };
      localStorage.setItem(courierCacheKey_(), JSON.stringify(payload));
    }catch(e){}
  }

  function loadOrdersCache_(){
    try{
      if (!sessionCourier || !sessionCourier.CourierId) return null;
      const raw = localStorage.getItem(courierCacheKey_());
      if (!raw) return null;
      const payload = JSON.parse(raw);
      if (!payload || !Array.isArray(payload.orders)) return null;
      return payload;
    }catch(e){
      return null;
    }
  }

  function cacheAgeLabel_(iso){
    try{
      const t = Date.parse(iso || "");
      if (!t) return "";
      const seconds = Math.max(0, Math.floor((Date.now() - t) / 1000));
      if (seconds < 60) return seconds + "s ago";
      const mins = Math.floor(seconds / 60);
      if (mins < 60) return mins + "m ago";
      const hrs = Math.floor(mins / 60);
      return hrs + "h ago";
    }catch(e){ return ""; }
  }

  function historyCacheKey_(){
    return LS_HISTORY_CACHE + "_" + String(sessionCourier && sessionCourier.CourierId || "").trim();
  }

  function saveHistoryCache_(orders){
    try{
      if (!sessionCourier || !sessionCourier.CourierId) return;
      localStorage.setItem(historyCacheKey_(), JSON.stringify({
        orders: Array.isArray(orders) ? orders : [],
        cachedAt: new Date().toISOString()
      }));
    }catch(e){}
  }

  function loadHistoryCache_(){
    try{
      if (!sessionCourier || !sessionCourier.CourierId) return null;
      const raw = localStorage.getItem(historyCacheKey_());
      if (!raw) return null;
      const payload = JSON.parse(raw);
      if (!payload || !Array.isArray(payload.orders)) return null;
      return payload;
    }catch(e){ return null; }
  }

  function renderCachedOrdersIfAvailable_(){
    const cached = loadOrdersCache_();
    if (!cached) return false;
    activeOrders = cached.orders || [];
    renderCurrentCourierView_();
    const age = cacheAgeLabel_(cached.cachedAt);
    setHint("Showing cached deliveries" + (age ? " · updated " + age : "") + ". Refreshing…");
    return true;
  }


  async function loadBuildInfo(){
    try{
      const res = await api("ping");
      document.getElementById("buildInfo").textContent = res && res.ok ? (res.build + " · " + new Date().toLocaleTimeString("nl-NL")) : "not connected";
    }catch(e){
      document.getElementById("buildInfo").textContent = "not connected";
    }
  }

  async function loginWithPin(){
    const pin = document.getElementById("pinInput").value.trim();
    const msg = document.getElementById("loginMsg");
    if (!pin) {
      msg.textContent = "Enter your PIN.";
      return;
    }

    msg.textContent = "Logging in…";
    const res = await api("courierLogin", { pin });
    if (!res || !res.ok || !res.courier) {
      msg.textContent = (res && res.error) || "Invalid PIN.";
      return;
    }

    saveSession(res.courier);
    document.getElementById("pinInput").value = "";
    msg.textContent = "";
    updateSessionUI();
    await loadOrders();
  }

  async function loadOrders(){
    if (!sessionCourier || !sessionCourier.CourierId) {
      updateSessionUI();
      setHint("Login with your PIN.");
      document.getElementById("orders").innerHTML = "";
      return;
    }

    const activeCached = loadOrdersCache_();
    const historyCached = loadHistoryCache_();

    if (activeCached) activeOrders = activeCached.orders || [];
    if (historyCached) historyOrders = historyCached.orders || [];

    if (activeCached || historyCached) {
      renderCurrentCourierView_();
      setHint("Showing cached data. Refreshing…");
    } else {
      setHint("Loading deliveries…");
    }

    try{
      const activeRes = await api("getCourierActiveOrders", { courierId:sessionCourier.CourierId });
      if (!activeRes || !activeRes.ok) throw new Error((activeRes && activeRes.error) || "Could not load active deliveries");
      activeOrders = activeRes.orders || [];
      saveOrdersCache_(activeOrders);

      const historyRes = await api("getCourierHistory", { courierId:sessionCourier.CourierId, days:historyDays });
      if (!historyRes || !historyRes.ok) throw new Error((historyRes && historyRes.error) || "Could not load history");
      historyOrders = historyRes.orders || [];
      saveHistoryCache_(historyOrders);

      renderCurrentCourierView_();
      setHint("Updated just now.");
    }catch(e){
      if (activeCached || historyCached) {
        renderCurrentCourierView_();
        setHint("Offline or slow connection. Showing cached data.");
        return;
      }
      throw e;
    }
  }

  function updateEarningsSummary_(){
    const active = Array.isArray(activeOrders) ? activeOrders : [];
    const history = Array.isArray(historyOrders) ? historyOrders : [];
    const earned = history.filter(o => isDeliveredStatus_(o.DeliveryStatus)).reduce((sum, o) => sum + courierFeeValue_(o), 0);
    const potential = active.reduce((sum, o) => sum + courierFeeValue_(o), 0) + earned;
    const remaining = active.length;
    const set = (id, value) => { const el = document.getElementById(id); if (el) el.textContent = value; };
    set("earnedToday", formatSRD(earned));
    set("potentialEarnings", formatSRD(potential));
    set("remainingDeliveries", String(remaining));
    const dc = document.getElementById("deliveryCount");
    if (dc) dc.textContent = remaining + " active";
  }

  function renderCurrentCourierView_(){
    updateEarningsSummary_();
    document.querySelectorAll(".portalTab").forEach(b => b.classList.toggle("active", b.dataset.view === currentView));
    const histActions = document.getElementById("historyActions");
    if (histActions) histActions.classList.toggle("hidden", currentView !== "history");
    renderOrders(currentView === "history" ? historyOrders : activeOrders, currentView === "history");
  }

  function renderOrders(orders, historyMode){
    const wrap = document.getElementById("orders");
    wrap.innerHTML = "";

    if (!orders.length) {
      wrap.innerHTML = `<div class="card empty">${historyMode ? "No history found." : "No active deliveries."}</div>`;
      return;
    }

    orders.forEach(o => {
      const card = document.createElement("div");
      card.className = "card deliveryCard";

      const address = [o.ShippingAddress, o.ShippingCity].filter(Boolean).join(", ");
      const fullAddress = address || o.DeliveryArea || "";
      const due = o.AmountDue !== "" && o.AmountDue !== null && o.AmountDue !== undefined
        ? o.AmountDue
        : o.OrderTotalSRD;

      card.innerHTML = `
        <div class="topLine">
          <div class="orderNo">Order ${escapeHtml(o.OrderNumber)}</div>
          <div class="grow"></div>
          <span class="pill ${statusKind(o.DeliveryStatus)}">${escapeHtml(deliveryStatusLabel(o.DeliveryStatus))}</span>
        </div>

        <div class="customer">${escapeHtml(o.CustomerName || "")}</div>
        <div class="phone">${escapeHtml(o.CustomerPhone || "")}</div>

        <div class="dueBox">
          <div>
            <div class="dueAmount">${escapeHtml(formatSRD(due))}</div>
            <div class="dueLabel">Amount Due</div>
          </div>
          <div class="dueLabel">${escapeHtml(o.PaymentStatus || "")}</div>
        </div>

        <div class="feeBox">
          <div>
            <div class="feeAmount">${escapeHtml(formatSRD(o.CourierFee || 0))}</div>
            <div class="feeLabel">Courier Fee</div>
          </div>
          <div class="muted">${escapeHtml(historyMode ? (o.DeliveryStatusAt || "") : assignedTimeLabel_(o))}</div>
        </div>

        <div class="addressBox">
          <div class="addressMain">${escapeHtml(o.ShippingAddress || o.DeliveryArea || "")}</div>
          <div class="addressSub">${escapeHtml(o.ShippingCity || o.DeliveryArea || "")}</div>
        </div>

        ${historyMode ? "" : `
        <div class="quickActions">
          <a class="btn blue" href="${escapeHtml(phoneHref(o.CustomerPhone))}" aria-label="Call customer">
            <span class="quickIcon"><svg class="quickSvg" viewBox="0 0 24 24"><path d="M5 4h4l2 5l-2.5 1.5a11 11 0 0 0 5 5l1.5 -2.5l5 2v4a2 2 0 0 1 -2 2a16 16 0 0 1 -15 -15a2 2 0 0 1 2 -2"></path></svg></span>
            <span class="quickLabel">Call</span>
          </a>
          <a class="btn blue" href="${escapeHtml(whatsappHrefForOrder_(o))}" target="_blank" rel="noopener" aria-label="WhatsApp customer">
            <span class="quickIcon"><svg class="quickSvg" viewBox="0 0 24 24"><path d="M3 21l1.65 -3.8a9 9 0 1 1 3.4 2.9l-5.05 .9"></path><path d="M9 10a.5 .5 0 0 0 1 0v-.5a.5 .5 0 0 0 -1 0v.5"></path><path d="M14 10a.5 .5 0 0 0 1 0v-.5a.5 .5 0 0 0 -1 0v.5"></path><path d="M9.5 14.5c1.5 1 3.5 1 5 0"></path></svg></span>
            <span class="quickLabel">WhatsApp</span>
          </a>
          <a class="btn blue" href="${escapeHtml(mapsHref(fullAddress))}" target="_blank" rel="noopener" aria-label="Navigate to address">
            <span class="quickIcon"><svg class="quickSvg" viewBox="0 0 24 24"><path d="M12 18.5l-3 -1.5l-6 3v-13l6 -3l6 3l6 -3v13l-6 3z"></path><path d="M9 4v13"></path><path d="M15 7v13"></path></svg></span>
            <span class="quickLabel">Navigate</span>
          </a>
        </div>

        <div class="noteBox">
          <div class="muted">Courier Note</div>
          <input class="input noteInput" data-note-for="${escapeHtml(o.OrderNumber)}" value="${escapeHtml(o.DeliveryStatusNote || "")}" placeholder="Optional note, e.g. customer requested later">
        </div>

        <div class="outcomeActions">
          <button class="btn primary" data-status="DELIVERED_REPORTED">DELIVERED</button>
          <button class="btn bad" data-status="NO_RESPONSE">NO RESPONSE</button>
          <button class="btn warn" data-status="CUSTOMER_NOT_AVAILABLE">CUSTOMER NOT AVAILABLE</button>
        </div>`}

        ${historyMode && o.DeliveryStatusNote ? `<div class="addressBox"><div class="muted">Courier Note</div><div class="addressMain">${escapeHtml(o.DeliveryStatusNote)}</div></div>` : ""}
      `;

      if (!historyMode) {
        card.querySelectorAll("[data-status]").forEach(btn => {
          btn.onclick = () => updateDeliveryStatus(o.OrderNumber, btn.getAttribute("data-status"), btn);
        });
      }

      wrap.appendChild(card);
    });
  }

  async function updateDeliveryStatus(orderNumber, status, btn){
    if (!sessionCourier || !sessionCourier.CourierId) return;

    const label = btn.textContent;
    const card = btn.closest(".deliveryCard");
    const noteEl = card ? card.querySelector("[data-note-for='" + String(orderNumber).replace(/'/g, "\\'") + "']") : null;
    const note = noteEl ? noteEl.value : "";

    btn.disabled = true;
    btn.textContent = "Saving…";

    try{
      const res = await api("setCourierDeliveryStatus", {
        orderNumber,
        courierId:sessionCourier.CourierId,
        deliveryStatus:status,
        note
      });
      if (!res || !res.ok) throw new Error((res && res.error) || "Save failed");
      await loadOrders();
      if (String(status || "").toUpperCase() === "DELIVERED_REPORTED") currentView = "history";
      renderCurrentCourierView_();
    }catch(e){
      alert("Save failed: " + (e.message || String(e)));
    }finally{
      btn.disabled = false;
      btn.textContent = label;
    }
  }


  function handlePortalTabClick_(ev){
    const btn = ev.target && ev.target.closest ? ev.target.closest(".portalTab") : null;
    if (!btn) return;
    ev.preventDefault();
    ev.stopPropagation();

    currentView = btn.getAttribute("data-view") || "active";
    renderCurrentCourierView_();
  }

  async function handleHistoryRangeClick_(ev){
    const btn = ev.target && ev.target.closest ? ev.target.closest("[data-days]") : null;
    if (!btn) return;
    ev.preventDefault();
    ev.stopPropagation();

    historyDays = Number(btn.getAttribute("data-days") || 30);
    document.querySelectorAll("[data-days]").forEach(b => b.classList.toggle("primary", b === btn));

    try {
      await loadOrders();
    } catch(e) {
      setHint(e.message || String(e));
    }
  }

  async function init(){
    document.getElementById("apiBase").value = getApiBase();

    document.getElementById("btnSettings").onclick = () => {
      document.getElementById("settingsCard").classList.toggle("show");
    };

    document.getElementById("btnSaveApi").onclick = () => {
      setApiBase(document.getElementById("apiBase").value);
      document.getElementById("settingsMsg").textContent = "Saved.";
      loadBuildInfo();
    };

    document.getElementById("btnPing").onclick = async () => {
      try{
        const res = await api("ping");
        document.getElementById("settingsMsg").textContent = res && res.ok ? "Connected: " + res.build : "Ping failed";
      }catch(e){
        document.getElementById("settingsMsg").textContent = e.message || String(e);
      }
    };

    document.getElementById("btnLogout").onclick = () => {
      saveSession(null);
      activeOrders = [];
      historyOrders = [];
      updateSessionUI();
      document.getElementById("orders").innerHTML = "";
      document.getElementById("deliveryCount").textContent = "0 deliveries";
      updateEarningsSummary_();
      setHint("Logged out. Enter courier PIN.");
      document.getElementById("loginCard").classList.remove("hidden");
    };

    document.getElementById("btnLogin").onclick = () => loginWithPin().catch(e => {
      document.getElementById("loginMsg").textContent = e.message || String(e);
    });

    document.getElementById("pinInput").addEventListener("keydown", ev => {
      if (ev.key === "Enter") {
        ev.preventDefault();
        loginWithPin().catch(e => {
          document.getElementById("loginMsg").textContent = e.message || String(e);
        });
      }
    });

    const portalTabsEl = document.getElementById("portalTabs");
    if (portalTabsEl) portalTabsEl.addEventListener("click", handlePortalTabClick_);

    const historyActionsEl = document.getElementById("historyActions");
    if (historyActionsEl) historyActionsEl.addEventListener("click", handleHistoryRangeClick_);

    document.getElementById("btnRefresh").onclick = () => loadOrders().catch(e => setHint(e.message || String(e)));

    await loadBuildInfo();

    sessionCourier = loadSession();
    updateSessionUI();

    if (sessionCourier && sessionCourier.CourierId) {
      try{ await loadOrders(); }
      catch(e){ setHint(e.message || String(e)); }
    } else if (!getApiBase()) {
      document.getElementById("settingsCard").classList.add("show");
      setHint("Set API URL first.");
    } else {
      setHint("Login with courier PIN.");
    }
  }

  init();
</script>
</body>
</html>
